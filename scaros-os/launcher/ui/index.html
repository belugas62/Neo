<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scaros OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- fonts:local -->
<style>
@font-face { font-family: "Inter"; src: url("fonts/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
</style>
<!-- /fonts:local -->
<style>
/* Layout: 10-foot home screen — a cinematic "shelf" for the focused app fills the top,
   a single row of label-less app icons sits under it; Réglages open full screen,
   the control center slides in from the right. */
:root {
  --ink: #05070b;
  --ink-2: #0d1118;
  --glass: #ffffff12;
  --glass-2: #ffffff1f;
  --line: #ffffff1c;
  --text: #f3f5f9;
  --text-2: #c6cbd5;
  --muted: #8a91a0;
  --focus-bg: #f3f5f9;
  --focus-fg: #0b0d12;
  --focus-muted: #4c5260;
  --sheet: #161b24f2;          /* panneaux flottants : centre de contrôle, notifications, volume */
  --ring: #ffffffe0;           /* contour de l'icône choisie */
  --shadow: #000;
  --scrim: .62;
  --field: #00000055;
  --shade: #05070bcc;          /* voile à gauche du grand visuel, sous le texte */
  --led: #ff5a1f;              /* ambre du logo */
  --pad-a: #6cc04a;
  --pad-b: #e5484d;
  --font: "Inter", "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --accent: #ff7a3d;           /* couleur d'accent (Réglages › Accueil) */
  --u: min(1vw, 1.7778vh);
  --fs: 1;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.3, 1.3, .45, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
html { font-size: var(--u); background: #000; }
html[data-text="large"] { --fs: 1.12; }
html[data-text="xlarge"] { --fs: 1.25; }
html[data-accent="blue"] { --accent: #4c8dff; }
html[data-accent="violet"] { --accent: #9b7bff; }
html[data-accent="green"] { --accent: #3fcf7a; }
html[data-accent="pink"] { --accent: #ff5fa2; }
html[data-accent="white"] { --accent: #f5f6f8; }
/* Apparence claire (Réglages › Affichage). data-look plutôt que data-theme : ce nom-là peut
   être posé par la page qui affiche la maquette. */
html[data-look="light"] {
  --ink: #eceef3;
  --ink-2: #f3f4f7;
  --glass: #0b0d120f;
  --glass-2: #0b0d121a;
  --line: #0b0d121f;
  --text: #0b0d12;
  --text-2: #353b47;
  --muted: #646b79;
  --focus-bg: #15181f;
  --focus-fg: #ffffff;
  --focus-muted: #b4bac6;
  --sheet: #fbfbfdf2;
  --ring: #15181fe6;
  --shadow: #1a1f2b66;
  --scrim: .3;
  --field: #ffffffc0;
  --shade: #eceef3d9;
  color-scheme: light;
}
/* écran de veille, extinction et téléphone de démo restent sombres */
.off, .phone { --text: #f3f5f9; --text-2: #c6cbd5; --muted: #8a91a0; --line: #ffffff1c; --glass: #ffffff12; --glass-2: #ffffff1f; }
.phone { color: var(--text); }
body, .stage, .pane, .pane.side, .toast, .vol { transition: background-color .45s ease, color .45s ease; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--font); font-size: calc(1.65rem * var(--fs)); line-height: 1.4;
  overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.ic { display: block; width: 1.4rem; height: 1.4rem; flex: none; }

/* ---------- accueil (façon Google TV) ----------
   En haut à gauche : l'heure, la date et les onglets ; à droite : scores, météo, boutons ronds.
   Au milieu : une rangée d'affiches (Plex, Overseerr) ; en bas : la bande des applis.
   Le fond reprend l'affiche choisie, floutée (ou le paysage animé, ou un fond uni : Réglages › Accueil).
   L'accueil reste sombre, même en apparence claire : c'est un écran de cinéma. */
.tv { position: relative; height: 100%; overflow: hidden; background: #000; }
.stage {
  position: relative; height: 100%; background: #06080c; transition: opacity .6s ease, filter .6s ease;
  --text: #f5f6f8; --text-2: #c9ced8; --muted: #8e95a3; --line: #ffffff1c; --glass: #ffffff12; --glass-2: #ffffff1f; color: var(--text);
  --side: max(16px, env(safe-area-inset-left, 0px), 4.6rem);
}
.stage.off-anim { opacity: 0; filter: brightness(.3); }
.stage[data-bg="decor"] .topbar, .stage[data-bg="decor"] .pc-title, .stage[data-bg="decor"] .pc-sub, .stage[data-bg="decor"] .icon-name, .stage[data-bg="decor"] .foot { text-shadow: 0 .15rem 1.2rem #000000a0; }
.stage[data-bg="decor"] .pc-sub { color: var(--text-2); }

/* décor : ciel, soleil ou lune, montagnes, lac, prairie */
.decor { position: absolute; inset: 0; display: none; overflow: hidden;
  --sky-a: #2c6cc0; --sky-b: #a7d0f2; --far: #8fa9c6; --mid: #5b7896; --near: #2d4a3e; --lake: #79acdf; --tree: #1f362d; --cap: .85;
  --orb: #fff6d8; --orb-glow: #ffd77a99; --orb-x: 74%; --orb-y: 24%; --orb-size: 7rem; }
.stage[data-bg="decor"] .decor { display: block; }
.decor-sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 68%); transition: opacity 1s ease; }
.decor-orb { position: absolute; left: var(--orb-x); top: var(--orb-y); width: var(--orb-size); height: var(--orb-size); border-radius: 50%;
  transform: translate(-50%, -50%); background: radial-gradient(circle at 42% 38%, #ffffff 0 18%, var(--orb) 62%); box-shadow: 0 0 4rem 1.4rem var(--orb-glow), 0 0 14rem 6rem color-mix(in oklab, var(--orb-glow) 45%, transparent);
  transition: top 1.2s var(--ease), background 1s ease, opacity 1s ease; }
.decor[data-orb="none"] .decor-orb { opacity: 0; }
.decor[data-orb="moon"] .decor-orb { --orb-size: 5rem;
  background: radial-gradient(circle at 62% 64%, #00000014 0 9%, transparent 10%), radial-gradient(circle at 38% 42%, #0000000f 0 13%, transparent 14%),
    radial-gradient(circle at 40% 36%, #ffffff, var(--orb) 70%); }
.decor-land { position: absolute; inset: 0; width: 100%; height: 100%; }
.decor-land path, .decor-land rect { transition: fill 1.2s ease, opacity 1.2s ease; }

/* couleur de l'appli choisie dans la bande du bas (fond « Affiche ») */
.shelf { position: absolute; inset: 0; overflow: hidden; display: none; }
.stage[data-bg="poster"][data-zone="apps"] .shelf { display: block; }
.scene {
  position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease;
  background:
    radial-gradient(70% 80% at 80% 20%, color-mix(in oklab, var(--a) 40%, transparent), transparent 70%),
    radial-gradient(60% 70% at 0% 100%, color-mix(in oklab, var(--b) 75%, transparent), transparent 72%),
    linear-gradient(180deg, color-mix(in oklab, var(--b) 40%, #06080c) 0%, #06080c 100%);
}
.scene.on { opacity: 1; }
.scene-art { display: none; }

/* l'affiche choisie, en grand et floutée derrière tout */
.backdrop { position: absolute; inset: 0; display: none; overflow: hidden;
  background: radial-gradient(80% 70% at 85% 0%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 70%), #07090d; }
.stage[data-bg="poster"] .backdrop, .stage[data-bg="plain"] .backdrop { display: block; }
.stage[data-bg="poster"][data-zone="apps"] .backdrop { opacity: 0; }
.bd { position: absolute; inset: -5%; background: center 25% / cover no-repeat; opacity: 0; transition: opacity 1s ease;
  filter: blur(1.4rem) saturate(1.3) brightness(.62); }
.bd.on { opacity: 1; }
.stage[data-bg="plain"] .bd { display: none; }
.home-scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, #05070bb3 0%, #05070b33 24%, #05070b14 42%, #05070b8c 66%, #05070bf0 100%),
    radial-gradient(90% 60% at 0% 0%, #05070b80, transparent 70%); }
.stage[data-bg="decor"] .home-scrim { background: linear-gradient(180deg, #00000085 0%, #00000038 28%, #0000004d 55%, #000000b8 100%); }

/* barre du haut : à gauche l'heure et la date, à droite les widgets (grandes cartes, au choix dans
   Réglages › Accueil › Widgets du haut) ; dessous, les onglets à gauche et les boutons ronds à droite */
.topbar { position: absolute; z-index: 3; top: 2.2rem; left: 0; right: 0; display: flex; align-items: center; gap: 2.4rem; height: 6.4rem;
  padding: 0 max(16px, env(safe-area-inset-right, 0px), 4.6rem) 0 var(--side); }
.tb-left { flex: none; }
.tb-time { display: flex; align-items: center; gap: 1.3rem; }
.tb-clock { font-size: calc(4rem * min(var(--fs), 1.1)); font-weight: 250; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; font-variation-settings: "opsz" 32; }
.tb-ampm { align-self: flex-end; margin: 0 0 .4rem -.8rem; font-size: calc(1.2rem * var(--fs)); font-weight: 600; letter-spacing: .06em; }
.tb-ampm:empty { display: none; }
.tb-sep { width: 1px; height: 3rem; background: currentColor; opacity: .28; }
.tb-date { display: flex; flex-direction: column; gap: .2rem; font-size: calc(1.12rem * min(var(--fs), 1.15)); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--text-2); line-height: 1.15; }
.tb-date b { font-weight: 600; color: var(--muted); }
.tabs { position: absolute; top: 7.6rem; left: calc(var(--side) - 1.1rem); display: flex; gap: .3rem; white-space: nowrap; }
.tab { position: relative; padding: .5rem 1.1rem .7rem; margin: 0; border: 0; border-radius: 99px; background: none; cursor: pointer;
  font-size: calc(1.42rem * min(var(--fs), 1.15)); font-weight: 500; color: var(--muted); transition: color .2s ease, background .2s ease, transform .25s var(--spring); }
.tab:focus { outline: none; }
.tab.on { color: var(--text); font-weight: 650; }
.tab.on::after { content: ""; position: absolute; left: 1.1rem; right: 1.1rem; bottom: .12rem; height: .2rem; border-radius: 2px; background: var(--accent); }
.tab.is-focus { background: var(--text); color: #0b0d12; transform: scale(1.05); }
.tab.is-focus::after { display: none; }
.tb-tools { position: absolute; top: 7.25rem; right: max(16px, env(safe-area-inset-right, 0px), 4.6rem); display: flex; align-items: center; gap: .8rem; }
.round { display: grid; place-items: center; flex: none; width: 3.6rem; height: 3.6rem; padding: 0; margin: 0; border-radius: 50%; cursor: pointer;
  border: 1px solid #ffffff21; background: #ffffff12; color: var(--text); transition: transform .25s var(--spring), background .2s ease, color .2s ease; }
.round:focus { outline: none; }
.round .ic { width: 1.65rem; height: 1.65rem; }
.round.dim { color: var(--muted); }
.round.is-focus { background: var(--text); color: #0b0d12; transform: scale(1.14); }
.st { display: grid; place-items: center; color: var(--text-2); }
.st .ic { width: 1.6rem; height: 1.6rem; }
.st.dim { opacity: .45; }
.cap-icons { display: flex; align-items: center; gap: .8rem; padding: 0 .3rem; }
.cap-icons:empty { display: none; }
/* widgets : de vraies cartes, lisibles depuis le canapé */
.widgets { flex: 1; min-width: 0; display: flex; justify-content: flex-start; align-items: center; gap: 1rem; overflow: hidden; padding: .6rem; margin: -.6rem; }
.widgets > :first-child { margin-left: auto; }
/* le match et la météo gardent leur taille ; la musique et l'air se raccourcissent s'il manque de la place */
.wg.wg-match, .wg.wg-wx { flex: none; }
.wg.wg-match .wg-col, .wg.wg-wx .wg-col { flex: none; }
.wg.wg-music { min-width: 15rem; }
.wg.wg-air { flex: none; }
.wg { display: flex; align-items: center; gap: 1.1rem; flex: 0 1 auto; min-width: 0; height: 6.2rem; padding: 0 1.6rem; margin: 0; box-sizing: border-box;
  border-radius: 1.6rem; border: 1px solid #ffffff1f; background: #12151ca6; color: var(--text); font: inherit; text-align: left; cursor: pointer;
  box-shadow: 0 1rem 2rem -1.4rem #000; transition: transform .25s var(--spring), background .2s ease, color .2s ease; animation: wgIn .5s var(--ease); }
.wg:focus { outline: none; }
.wg.is-focus { background: var(--text); color: #0b0d12; transform: scale(1.05); }
.wg.is-focus .wg-sub, .wg.is-focus .wg-k { color: #4c5260; }
@keyframes wgIn { from { opacity: 0; transform: translateY(-.6rem); } }
.wg-sub { font-size: calc(1.12rem * min(var(--fs), 1.1)); font-weight: 550; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wg-k { font-size: calc(.95rem * min(var(--fs), 1.1)); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.wg-col { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
.wg-big { font-size: calc(2.6rem * min(var(--fs), 1.1)); font-weight: 300; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.wg-match { gap: .9rem; padding: 0 1.3rem; }
.wg-match .lg { flex: none; width: 3.2rem; height: 3.2rem; object-fit: contain; }
.wg-match .tk-ph { flex: none; display: grid; place-items: center; width: 3.1rem; height: 3.1rem; border-radius: 50%; background: #ffffff24; font-size: 1rem; font-weight: 800; }
.wg-match .wg-col { align-items: center; }
.wgm-line { display: flex; align-items: center; gap: .7rem; font-size: calc(1.45rem * min(var(--fs), 1.1)); font-weight: 700; white-space: nowrap; }
.wgm-line .wg-big { font-size: calc(2.2rem * min(var(--fs), 1.1)); }
.wgm-sub { display: flex; align-items: center; gap: .5rem; }
.wg-wx .ic { flex: none; width: 3.2rem; height: 3.2rem; color: #ffd36b; stroke-width: 1.6; }
.wg.is-focus.wg-wx .ic { color: #c98a00; }
.wg-cover { position: relative; flex: none; width: 4.4rem; height: 4.4rem; overflow: hidden; border-radius: .9rem;
  background: linear-gradient(150deg, hsl(var(--h, 270) 60% 45%), hsl(calc(var(--h, 270) + 60) 55% 16%)); display: grid; place-items: center; }
.wg-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wg-cover .ic { width: 2rem; height: 2rem; color: #ffffffb3; }
.wg-music .wg-col { max-width: 17rem; }
.wg-title { font-size: calc(1.4rem * min(var(--fs), 1.1)); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eq { display: inline-flex; align-items: flex-end; gap: .18rem; height: 1rem; margin-right: .4rem; }
.eq i { width: .22rem; height: 100%; border-radius: 1px; background: var(--accent); animation: eq 1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
.eq { transform-origin: bottom; }
.eq i { transform-origin: bottom; }
.wg-air { gap: 1.6rem; }
.wg-air .wg-big { font-size: calc(2.3rem * min(var(--fs), 1.1)); }
.wg-air .lvl { display: inline-block; width: .8rem; height: .8rem; margin-right: .4rem; border-radius: 50%; background: var(--lvl, #3fcf7a); }
.tk-live { flex: none; width: .65rem; height: .65rem; border-radius: 50%; background: #ff453a; box-shadow: 0 0 .6rem #ff453a; animation: live 1.6s ease-in-out infinite; }
.tk-fav { flex: none; width: .55rem; height: .55rem; border-radius: 50%; background: var(--accent); }
.tk-ph { display: grid; place-items: center; border-radius: 50%; background: #ffffff24; font-weight: 800; }
@keyframes live { 50% { opacity: .35; } }

/* rangée d'affiches */
.rail { position: absolute; z-index: 2; left: 0; right: 0; top: 13.4rem; height: 23rem; overflow: hidden; padding: 1rem 0 0 var(--side); box-sizing: border-box; }
.rail-track { display: flex; align-items: flex-start; gap: 1.6rem; transition: transform .5s var(--ease); will-change: transform; }
.pc { flex: none; display: flex; flex-direction: column; width: 11.33rem; padding: 0; margin: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; font: inherit; }
.pc:focus { outline: none; }
.pc.wide { width: 30.2rem; }
.pc-img { position: relative; display: block; height: 17rem; overflow: hidden; border-radius: 1.1rem; background: #ffffff10;
  box-shadow: 0 1.2rem 2.2rem -1.4rem #000000d0; transition: transform .32s var(--spring), box-shadow .32s ease; }
.pc-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s ease; }
.pc-img img.ok { opacity: 1; }
.pc.is-focus .pc-img { transform: scale(1.06); box-shadow: 0 0 0 .2rem var(--text), 0 2rem 3.2rem -1.4rem #000000e6; }
/* affiche absente (pas encore chargée, ou maquette) : un dégradé et le titre */
.pc-ph { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 1.2rem; box-sizing: border-box;
  background: radial-gradient(90% 70% at 20% 0%, hsl(var(--h, 220) 70% 62% / .9), transparent 70%), linear-gradient(165deg, hsl(var(--h, 220) 55% 38%), hsl(calc(var(--h, 220) + 50) 50% 12%));
  font-size: 1.9rem; font-weight: 800; line-height: 1.02; letter-spacing: -.03em; color: #fff; text-shadow: 0 .2rem 1.2rem #0006; overflow-wrap: anywhere; }
.pc.wide .pc-ph { padding: 2rem; font-size: 3.4rem; }
.pc-badge { position: absolute; z-index: 1; left: .7rem; top: .7rem; max-width: calc(100% - 1.4rem); padding: .22rem .6rem; box-sizing: border-box; border-radius: .45rem;
  background: #0b0d12c2; color: #fff; font-size: calc(1rem * min(var(--fs), 1.1)); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-badge.ok { background: #1f9d58e6; }
.pc-prog { position: absolute; z-index: 1; left: .8rem; right: .8rem; bottom: .8rem; height: .36rem; border-radius: 99px; background: #ffffff45; overflow: hidden; }
.pc-prog i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.pc-title { display: block; margin-top: .75rem; font-size: calc(1.38rem * min(var(--fs), 1.12)); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-sub { display: block; margin-top: .1rem; font-size: calc(1.14rem * min(var(--fs), 1.12)); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc.is-focus .pc-sub { color: var(--text-2); }
/* carte « message » : compte à relier, serveur muet, rangée vide */
.pc.msg { width: 52rem; }
.pc-msg { display: flex; flex-direction: column; justify-content: center; gap: .7rem; height: 17rem; padding: 2.4rem 3rem; box-sizing: border-box; border-radius: 1.1rem;
  background: #ffffff0d; border: 1px solid #ffffff1f; transition: transform .32s var(--spring), background .2s ease; }
.pc-msg .ic { width: 3rem; height: 3rem; color: var(--accent); }
.pc-msg b { font-size: calc(2.1rem * min(var(--fs), 1.1)); font-weight: 700; letter-spacing: -.02em; }
.pc-msg span { font-size: calc(1.42rem * min(var(--fs), 1.1)); color: var(--text-2); }
.pc-msg em { font-style: normal; font-size: calc(1.2rem * min(var(--fs), 1.1)); font-weight: 650; color: var(--muted); }
.pc.msg.is-focus .pc-msg { transform: scale(1.02); background: #ffffff1c; box-shadow: 0 0 0 .2rem var(--text); }
.pc.skel .pc-img { background: linear-gradient(100deg, #ffffff0c 30%, #ffffff1c 50%, #ffffff0c 70%) 0 0 / 300% 100%; animation: skel 1.4s linear infinite; }
@keyframes skel { from { background-position: 100% 0; } to { background-position: 0 0; } }

/* bande des applis */
.apps { position: absolute; z-index: 2; left: 0; right: 0; top: 38.3rem; padding: 1.3rem 0 1rem var(--side); overflow: hidden; }
.icons { display: flex; gap: 1.8rem; transition: transform .5s var(--ease); will-change: transform; }
.icon { position: relative; flex: none; width: 15.8rem; padding: 0; margin: 0; border: 0; background: none; cursor: pointer; color: inherit; font: inherit; }
.icon:focus { outline: none; }
.icon-art { position: relative; display: grid; place-items: center; overflow: hidden; aspect-ratio: 16 / 9; border-radius: 1.1rem; background: var(--bg);
  box-shadow: 0 .9rem 1.8rem -1.2rem #000000c0, inset 0 0 0 1px #ffffff14; transition: transform .32s var(--spring), box-shadow .32s ease; }
.icon-art svg { width: 50%; height: 58%; }
.icon-art .mono { font-size: 4.4rem; font-weight: 800; letter-spacing: -.04em; color: #fff; text-shadow: 0 .3rem 1.2rem #0004; }
.icon-art .app-ico { position: absolute; inset: 0; margin: auto; width: 44%; height: 66%; object-fit: contain; filter: drop-shadow(0 .4rem .8rem #0005); }
.icon-art:has(.app-ico) .mono { visibility: hidden; }
.icon[data-id="youtube"] .icon-art svg { width: 44%; }
.icon[data-id="twitch"] .icon-art svg { width: 44%; height: 54%; }
.icon[data-id="scarostv"] .icon-art svg { width: 36%; height: 72%; filter: drop-shadow(0 .25rem .45rem #02143373); }
.icon.is-focus .icon-art { transform: scale(1.08); box-shadow: 0 0 0 .2rem var(--text), 0 1.8rem 2.8rem -1.2rem #000000e6; }
.icon-name { display: block; margin-top: 1rem; text-align: center; font-size: calc(1.45rem * min(var(--fs), 1.1)); font-weight: 600; color: var(--muted); transition: color .2s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon.is-focus .icon-name { color: var(--text); }
.icon.bump .icon-art, .pc.bump .pc-img, .tab.bump, .round.bump { animation: bump .32s ease; }

.foot {
  position: absolute; bottom: 1.3rem; left: 0; right: 0; z-index: 2;
  display: flex; justify-content: center; font-size: calc(1.2rem * var(--fs)); color: var(--muted);
}
.ver { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.hint-list { display: flex; gap: 2.2rem; opacity: .85; }
.hint { display: flex; align-items: center; gap: .55rem; }
.bg { display: inline-grid; place-items: center; min-width: 2.3rem; height: 2.3rem; padding: 0 .1rem; box-sizing: border-box; border-radius: 99px; font-size: calc(1.2rem * var(--fs)); font-weight: 700; color: #0b0d12; text-shadow: none; }

.g-a { background: var(--pad-a); }

.stage.enter { animation: homeIn 1.3s cubic-bezier(.16, 1, .3, 1) .08s both; }

/* ---------- météo animée sur le décor : nuages, pluie, neige, étoiles, aurore ----------

.sky {

.sky[data-sky~="rain"] .sky-rain, .sky[data-sky~="snow"] .sky-snow, .sky[data-sky~="flash"] .sky-flash { display: block; }

/* rayons qui tournent lentement autour du soleil du décor */

  background-image:
    radial-gradient(.13rem .13rem at 3rem 4rem, var(--star) 50%, transparent), radial-gradient(.1rem .1rem at 11rem 15rem, var(--star) 50%, transparent),
    radial-gradient(.16rem .16rem at 19rem 7rem, var(--star) 50%, transparent), radial-gradient(.1rem .1rem at 26rem 18rem, var(--star) 50%, transparent),
    radial-gradient(.12rem .12rem at 7rem 20rem, var(--star) 50%, transparent), radial-gradient(.09rem .09rem at 23rem 2rem, var(--star) 50%, transparent),
    radial-gradient(.11rem .11rem at 15rem 11rem, var(--star) 50%, transparent), radial-gradient(.14rem .14rem at 29rem 12rem, var(--star) 50%, transparent);
  -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent); mask-image: linear-gradient(180deg, #000 55%, transparent); }

@keyframes twinkle { from { opacity: .35; } to { opacity: .95; } }

.sky-aurora { inset: -10% -10% 45%; }
.sky-aurora i { position: absolute; width: 70rem; height: 22rem; border-radius: 50%; opacity: .55; }
.sky-aurora i:nth-child(1) { left: 0; top: 7rem; background: radial-gradient(closest-side, #2ee59d80, transparent); animation: auroraA 22s ease-in-out infinite alternate; }
.sky-aurora i:nth-child(2) { left: 30%; top: 3rem; background: radial-gradient(closest-side, #3fb6ff66, transparent); animation: auroraB 27s ease-in-out infinite alternate; }
.sky-aurora i:nth-child(3) { left: 55%; top: 10rem; background: radial-gradient(closest-side, #a46bff5c, transparent); animation: auroraA 31s ease-in-out -9s infinite alternate-reverse; }
@keyframes auroraA { from { transform: translateX(-8rem) rotate(-8deg) scaleY(.8); } to { transform: translateX(10rem) rotate(6deg) scaleY(1.15); } }
@keyframes auroraB { from { transform: translateX(6rem) rotate(5deg); } to { transform: translateX(-9rem) rotate(-7deg) scaleY(1.2); } }

/* nuages : plusieurs boules douces qui forment un vrai nuage, et qui dérivent */
.sky-clouds { inset: 0 0 45%; }
.sky-clouds i { position: absolute; left: 0; width: 36rem; height: 12rem; animation: drift 150s linear infinite;
  background:
    radial-gradient(closest-side at 30% 62%, rgba(var(--cloud), var(--cloud-o)), transparent),
    radial-gradient(closest-side at 52% 44%, rgba(var(--cloud), var(--cloud-o)), transparent),
    radial-gradient(closest-side at 72% 64%, rgba(var(--cloud), var(--cloud-o)), transparent),
    radial-gradient(46% 25% at 50% 72%, rgba(var(--cloud), calc(var(--cloud-o) * .9)), transparent); }

.sky-fog { inset: 14rem 0 auto; height: 40rem; }

  background: linear-gradient(90deg, transparent, #ffffff3d 20%, transparent 40%, #ffffff33 65%, transparent 85%);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent); mask-image: linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent);
  animation: fogMove 70s linear infinite; }

.sky-rain { inset: -30rem -12% 0; transform: rotate(9deg); }

  background-image:
    radial-gradient(.11rem 1.7rem at 2rem 3rem, var(--drop), transparent), radial-gradient(.11rem 1.7rem at 9rem 17rem, var(--drop), transparent),
    radial-gradient(.11rem 1.7rem at 15rem 8rem, var(--drop), transparent), radial-gradient(.11rem 1.7rem at 21rem 22rem, var(--drop), transparent),

.sky-snow { inset: -26rem 0 0; animation: sway 5s ease-in-out infinite alternate; }

  background-image:
    radial-gradient(.3rem .3rem at 3rem 4rem, var(--flake) 45%, transparent), radial-gradient(.22rem .22rem at 12rem 16rem, var(--flake) 45%, transparent),
    radial-gradient(.34rem .34rem at 19rem 7rem, var(--flake) 45%, transparent), radial-gradient(.24rem .24rem at 23rem 21rem, var(--flake) 45%, transparent),
    radial-gradient(.28rem .28rem at 7rem 22rem, var(--flake) 45%, transparent), radial-gradient(.2rem .2rem at 16rem 1rem, var(--flake) 45%, transparent); }

@keyframes sway { from { transform: translateX(-1.6rem); } to { transform: translateX(1.6rem); } }

.sky-flash { inset: 0; background: #e8eeff; opacity: 0; animation: flash 9s linear infinite; }
@keyframes flash { 0%, 90% { opacity: 0; } 91% { opacity: .28; } 92% { opacity: 0; } 94% { opacity: .18; } 96%, 100% { opacity: 0; } }

/* météo : à côté de l'heure, dans le centre de contrôle, sur l'écran de veille */
.wx-chip { display: flex; align-items: center; gap: .55rem; font-size: calc(2.1rem * var(--fs)); font-weight: 600; color: inherit; font-variant-numeric: tabular-nums; }

/* recopie AirPlay : sous la fenêtre vidéo d'UxPlay (visible quand le centre de contrôle s'ouvre par-dessus) */
.ap { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center; background: #000; color: #fff; }

/* ---------- Réglages (plein écran) & centre de contrôle ---------- */
.scrim { position: fixed; inset: 0; z-index: 31; background: #000; opacity: 0; transition: opacity .35s ease; }

.pane {
  position: fixed; z-index: 32; inset: 0; box-sizing: border-box; display: flex; flex-direction: column;
  background: radial-gradient(70% 60% at 22% 40%, color-mix(in oklab, var(--pa, #6b7385) 22%, transparent), transparent 70%), var(--ink-2);
  padding: max(2.6rem, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px), 6rem) 2.4rem max(16px, env(safe-area-inset-left, 0px), 6rem);
  opacity: 0; transform: scale(1.03); transition: opacity .35s ease, transform .45s var(--ease);
}

  inset: 1.6rem max(1.6rem, env(safe-area-inset-right, 0px)) 1.6rem auto; width: 46rem; overflow: hidden; border-radius: 2rem;
  padding: 2.4rem 2rem; background: var(--sheet); border: 1px solid var(--line); box-shadow: 0 2rem 5rem -1rem var(--shadow);
  transform: translateX(110%);
}

.pane-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 30% minmax(0, 1fr); gap: 4rem; margin-top: 1.4rem; }
.pane-art { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.8rem; }
.art-tile {
  display: grid; place-items: center; width: 17rem; height: 17rem; border-radius: 3.8rem;
  background: linear-gradient(160deg, var(--pa, #8a92a3), var(--pb, #3b414d));
  box-shadow: 0 3rem 5rem -2rem #000000c0, inset 0 1px 0 #ffffff40; color: #fff;
}
.art-tile .ic { width: 8rem; height: 8rem; stroke-width: 1.6; }
.art-tile > svg:not(.ic) { width: 60%; height: 60%; }
.art-tile svg.mark { width: 78%; height: 78%; color: var(--text); }
.art-caption { margin: 0; max-width: 26rem; text-align: center; font-size: calc(1.55rem * var(--fs)); color: var(--muted); }
.pane-main { min-height: 0; overflow-y: auto; padding: 1rem 1.2rem 3rem; margin: -1rem -1.2rem 0; scrollbar-width: none; scroll-padding: 2rem 0 calc(18% + 1rem); }
/* fondu en bas tant qu'il reste des réglages plus bas */
.pane-main.more { -webkit-mask-image: linear-gradient(180deg, #000 82%, transparent); mask-image: linear-gradient(180deg, #000 82%, transparent); }
.pane-main::-webkit-scrollbar { display: none; }
.pane-title { margin: 0; font-size: calc(4.2rem * var(--fs)); font-weight: 700; letter-spacing: -.03em; line-height: 1.05; }
.pane-lead { margin: .7rem 0 1.8rem; max-width: 52rem; font-size: calc(1.75rem * var(--fs)); color: var(--text-2); }
.opts { display: flex; flex-direction: column; gap: .55rem; }
.opt {
  display: flex; align-items: center; gap: 1.5rem; width: 100%; min-height: 5.8rem; box-sizing: border-box;
  padding: .9rem 1.7rem; margin: 0; border: 0; border-radius: 1.1rem; background: var(--glass);
  text-align: left; cursor: pointer; transition: background .2s ease, color .2s ease, transform .25s var(--spring), box-shadow .25s ease;
}
.opt:focus { outline: none; }
.opt > .ic { width: 2.3rem; height: 2.3rem; color: var(--text-2); }
.opt.is-focus { background: var(--focus-bg); color: var(--focus-fg); transform: scale(1.025); box-shadow: 0 1.2rem 2.4rem -1rem #000000b0; }
.opt.is-focus > .ic, .opt.is-focus .opt-desc, .opt.is-focus .opt-val { color: var(--focus-muted); }
.opt[disabled] { cursor: default; opacity: .4; }
.opt-main { display: flex; flex-direction: column; gap: .15rem; flex: 1; min-width: 0; }
.opt-title { font-size: calc(1.95rem * var(--fs)); font-weight: 600; }
.opt-desc { font-size: calc(1.45rem * var(--fs)); color: var(--muted); }
.opt-val { flex: none; font-size: calc(1.65rem * var(--fs)); color: var(--text-2); white-space: nowrap; }
.chev { flex: none; width: 1.8rem; height: 1.8rem; color: var(--muted); }

.check { flex: none; width: 2.3rem; height: 2.3rem; color: var(--text); opacity: 0; }

.opt.is-focus .check { color: var(--focus-fg); }
.opt-group { margin: 2rem 0 .6rem; padding: 0 .4rem; font-size: calc(1.3rem * var(--fs)); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.opt-group:first-child { margin-top: 0; }
.opt-empty, .note { margin: 0; padding: .4rem .4rem; font-size: calc(1.6rem * var(--fs)); color: var(--muted); }
.card { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.6rem; padding: 1.3rem 1.5rem; border-radius: 1.1rem; background: var(--glass); border: 1px solid var(--line); }
.sdot { flex: none; width: 1rem; height: 1rem; border-radius: 50%; background: var(--muted); }
.sdot.on { background: var(--pad-a); box-shadow: 0 0 .8rem var(--pad-a); }
.card-title { font-weight: 600; font-size: calc(1.8rem * var(--fs)); }
.card-sub { font-size: calc(1.45rem * var(--fs)); color: var(--muted); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: .9rem 2.4rem; margin: 0 0 2rem; padding: 1.5rem; border-radius: 1.1rem; background: var(--glass); }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
/* diagnostic réseau : consigne pendant l'écoute, puis rapport par rubriques */
.diag-now { margin-bottom: 1.6rem; padding: 1.8rem 2rem; border-radius: 1.4rem; background: var(--glass); border: 1px solid var(--line); }

.diag-now .u { margin: .3rem 0 .9rem; font-size: calc(3.2rem * var(--fs)); font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.diag-sec { margin: 0 0 1rem; padding: 1.2rem 1.5rem; border: 1px solid var(--line); border-radius: 1.1rem; background: var(--glass); transition: border-color .2s; }

.diag-l.ok .ic { color: var(--pad-a); }
.diag-l.bad { color: var(--text); }
.diag-l.bad .ic { color: #ff9f43; }
.diag-l.inf { padding-left: 2.7rem; color: var(--muted); }
.spin { display: inline-block; width: 1.3rem; height: 1.3rem; box-sizing: border-box; border: .17rem solid color-mix(in oklab, currentColor 22%, transparent); border-top-color: currentColor; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.remote-grid { display: grid; grid-template-columns: auto 1fr; gap: 2.4rem; align-items: center; margin-bottom: 2rem; }
.qr-card { display: flex; flex-direction: column; align-items: center; gap: .8rem; }
.qr-card svg, .qr-card img { display: block; width: 13rem; height: 13rem; border-radius: 1rem; background: #fff; }
.qr-addr { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-2); }
.steps { display: flex; flex-direction: column; gap: 1.1rem; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: flex; align-items: center; gap: 1.2rem; font-size: calc(1.75rem * var(--fs)); color: var(--text-2); counter-increment: s; }
.steps li::before { content: counter(s); flex: none; display: grid; place-items: center; width: 2.8rem; height: 2.8rem; font-weight: 700; font-size: calc(1.4rem * var(--fs)); color: var(--text); border: 1px solid var(--line); border-radius: 50%; }
kbd { font-family: var(--font); font-weight: 700; padding: .05rem .45rem; border: 1px solid var(--line); border-radius: .35rem; }
/* interrupteurs, pastilles de couleur, code Plex, affiche d'une fiche */
.tgl { position: relative; flex: none; width: 4.4rem; height: 2.5rem; border-radius: 99px; background: var(--glass-2); transition: background .2s ease; }
.tgl::after { content: ""; position: absolute; top: .25rem; left: .25rem; width: 2rem; height: 2rem; border-radius: 50%; background: var(--text-2); transition: transform .25s var(--spring), background .2s ease; }
.tgl.on { background: var(--accent); }
.tgl.on::after { transform: translateX(1.9rem); background: #fff; }
.opt.is-focus .tgl:not(.on) { background: color-mix(in oklab, var(--focus-fg) 18%, transparent); }
.opt.is-focus .tgl:not(.on)::after { background: var(--focus-muted); }
.swatch { display: inline-block; width: 1.5rem; height: 1.5rem; margin-right: .9rem; border-radius: 50%; background: var(--sw); vertical-align: -.25rem; box-shadow: inset 0 0 0 1px #00000033; }
.code-box { margin-bottom: 1.2rem; padding: 1.8rem 2rem; border-radius: 1.4rem; background: var(--glass); border: 1px solid var(--line); }
.code-box p { margin: 0; }
.code-box .k { margin-bottom: .6rem; font-size: calc(1.3rem * var(--fs)); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.code-box .t { font-size: calc(1.6rem * var(--fs)); color: var(--text-2); }
.code-box .code { margin: .6rem 0 .8rem; font-size: calc(5.6rem * var(--fs)); font-weight: 700; letter-spacing: .32em; font-variant-numeric: tabular-nums; }
.pc.mcard { width: 24rem; }
.mc { display: flex; flex-direction: column; justify-content: space-between; padding: 1.5rem 1.7rem 1.7rem; box-sizing: border-box;
  background: radial-gradient(120% 90% at 0% 0%, #2a3448, #121620 70%); border: 1px solid #ffffff14; }
.pc.mcard.fav .mc { background: radial-gradient(120% 90% at 0% 0%, color-mix(in oklab, var(--accent) 38%, #1a2030), #121620 72%); }
.mc-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; font-size: calc(1.08rem * min(var(--fs), 1.1)); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); }
.mc-lg { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mc-st { display: flex; align-items: center; gap: .5rem; flex: none; white-space: nowrap; letter-spacing: .04em; text-transform: none; font-size: calc(1.2rem * min(var(--fs), 1.1)); }
.mc-st.onair { color: #ff6b61; }
.mc-team { display: flex; align-items: center; gap: 1.1rem; font-size: calc(1.7rem * min(var(--fs), 1.1)); font-weight: 650; }
.mc-team img, .mc-team .tk-ph { flex: none; width: 3.4rem; height: 3.4rem; object-fit: contain; }
.pc-img.mc .mc-team img { position: static; inset: auto; width: 3.4rem; height: 3.4rem; opacity: 1; object-fit: contain; filter: drop-shadow(0 .2rem .5rem #0006); }
.mc-team .tk-ph { font-size: 1.1rem; }
.mc-team .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mc-team .sc { font-size: calc(3rem * min(var(--fs), 1.1)); font-weight: 300; font-variant-numeric: tabular-nums; }
.mh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2rem; margin: .4rem 0 1.4rem; padding: 2rem; border-radius: 1.6rem; background: var(--glass); border: 1px solid var(--line); }
.mh.onair { border-color: #ff453a66; }
.mh:focus { outline: none; }
.mh.is-focus { border-color: color-mix(in oklab, var(--text) 50%, transparent); }
.mh-t { display: flex; flex-direction: column; align-items: center; gap: .8rem; text-align: center; font-size: calc(1.7rem * var(--fs)); }
.mh-t img, .mh-t .tk-ph { width: 6rem; height: 6rem; object-fit: contain; }
.mh-t .tk-ph { font-size: 1.6rem; }
.mh-mid { text-align: center; }
.mh-mid p { margin: 0; }
.mh-sc { font-size: calc(5rem * min(var(--fs), 1.1)); font-weight: 250; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.mh-st { display: flex; align-items: center; justify-content: center; gap: .5rem; margin-top: .6rem !important; font-size: calc(1.4rem * var(--fs)); color: var(--text-2); }
.ev-list { display: flex; flex-direction: column; gap: .5rem; }
.ev { display: grid; grid-template-columns: 5rem 2.4rem 1fr; align-items: center; gap: .6rem; font-size: calc(1.5rem * var(--fs)); color: var(--text-2); }
.ev.away { grid-template-columns: 1fr 2.4rem 5rem; text-align: right; }
.ev.away .ev-t { order: 3; } .ev.away .ev-i { order: 2; } .ev.away .ev-x { order: 1; }
.ev.goal { color: var(--text); font-weight: 650; }
.ev-t { font-variant-numeric: tabular-nums; color: var(--muted); }
.ev.away .ev-t { text-align: right; }
.ev-i { text-align: center; }
.fcard { display: inline-block; width: .9rem; height: 1.25rem; border-radius: .15rem; vertical-align: -.15rem; }
.fcard.y { background: #ffd23f; } .fcard.r { background: #ff453a; }
.ev-half { margin: .3rem 0; text-align: center; font-size: calc(1.15rem * var(--fs)); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stat { display: grid; grid-template-columns: 6rem 1fr 6rem; align-items: center; row-gap: .3rem; margin: .6rem 0; font-size: calc(1.5rem * var(--fs)); }
.stat p { margin: 0; text-align: center; color: var(--text-2); font-size: calc(1.3rem * var(--fs)); }
.stat span:last-of-type { text-align: right; }
.stat .bar { grid-column: 1 / -1; display: block; height: .4rem; border-radius: 99px; background: color-mix(in oklab, var(--text) 18%, transparent); overflow: hidden; }
.stat .bar b { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.store-row .st-ico { position: relative; flex: none; display: grid; place-items: center; width: 4.4rem; height: 4.4rem; overflow: hidden; border-radius: 1.1rem;
  background: linear-gradient(160deg, color-mix(in oklab, var(--c) 85%, #fff), color-mix(in oklab, var(--c) 70%, #000)); color: #fff; font-size: 2rem; }
.store-row .st-ico img { position: absolute; inset: .5rem; width: calc(100% - 1rem); height: calc(100% - 1rem); object-fit: contain; }
.store-row .st-ico:has(img) { background: #ffffff14; }
.store-row .st-ico:has(img) b { visibility: hidden; }
.store-row .opt-desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.store-row.done .opt-val { color: var(--pad-a); }
.opt.is-focus.store-row.done .opt-val { color: #1f8a3e; }
.tag { display: inline-block; margin-left: .5rem; padding: .05rem .5rem; border-radius: .4rem; font-size: calc(1.05rem * var(--fs)); font-weight: 700; vertical-align: .15rem;
  color: var(--text-2); border: 1px solid var(--line); }
.opt.is-focus .tag { color: var(--focus-muted); border-color: color-mix(in oklab, var(--focus-fg) 25%, transparent); }
.art-tile .mono { font-size: 7rem; font-weight: 800; color: #fff; }
.art-tile .app-ico { width: 60%; height: 60%; object-fit: contain; }
.art-tile:has(.app-ico) .mono { display: none; }
.art-tile.poster { position: relative; width: 17rem; height: 25.5rem; overflow: hidden; border-radius: 1.6rem; }
.art-tile.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art-tile.poster .pc-ph { font-size: 2.2rem; }

/* écran télécommande : le QR code en grand */
.pane.qrs { justify-content: center; }
.qr-screen { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 5.5rem; }
.qr-big { display: grid; place-items: center; width: min(40rem, 72vh); aspect-ratio: 1; box-sizing: border-box; padding: 1.6rem; border-radius: 2.4rem; background: #fff; box-shadow: 0 3rem 6rem -2rem #000000d0; }
.qr-big svg, .qr-big img { display: block; width: 100%; height: 100%; }
.qr-big .qr-wait { margin: 0; padding: 2rem; text-align: center; font-size: calc(1.6rem * var(--fs)); font-weight: 600; color: var(--focus-fg); }
.qr-side { min-width: 0; max-height: calc(100vh - 5rem); overflow-y: auto; scrollbar-width: none; padding: .6rem 1rem; margin: -.6rem -1rem; }
.qr-side::-webkit-scrollbar { display: none; }
.qr-title { margin: .6rem 0 0; font-size: calc(3.6rem * var(--fs)); font-weight: 700; letter-spacing: -.03em; line-height: 1.08; text-wrap: balance; }
.qr-url { margin: 1.6rem 0 2rem; font-size: calc(2.6rem * var(--fs)); font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.qr-url small { display: block; margin-bottom: .2rem; font-size: calc(1.3rem * var(--fs)); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.qr-status { display: flex; align-items: center; gap: 1rem; margin: 2.2rem 0 1.6rem; font-size: calc(1.75rem * var(--fs)); font-weight: 600; }
.qr-side .opts { max-width: 34rem; }
.pane.qrs .qr-title { font-size: calc(3.1rem * var(--fs)); }
.pane.qrs .qr-url { margin: 1.2rem 0 1.4rem; }
.pane.qrs .steps { gap: .7rem; }
.pane.qrs .steps li { font-size: calc(1.55rem * var(--fs)); }
.pane.qrs .steps li::before { width: 2.5rem; height: 2.5rem; }
.pane.qrs .qr-status { margin: 1.3rem 0 1rem; }
.qr-net { display: flex; align-items: center; gap: .8rem; margin: -.4rem 0 1.4rem; font-size: calc(1.55rem * var(--fs)); color: var(--text-2); }
.qr-net .ic { width: 2rem; height: 2rem; flex: none; }
.qr-net b { color: var(--text); }
.qr-help { margin: -.4rem 0 1.2rem; max-width: 46rem; font-size: calc(1.4rem * var(--fs)); color: var(--muted); }

/* clavier à l'écran (mots de passe Wi-Fi) */
.pw-field { display: flex; align-items: center; gap: 1rem; min-height: 5rem; margin-bottom: 1.4rem; padding: 0 1.6rem; border-radius: 1.1rem; background: var(--field); border: .15rem solid var(--line); font-size: calc(2rem * var(--fs)); font-weight: 600; letter-spacing: .04em; overflow: hidden; }
.pw-field .caret { width: .15rem; height: 2.2rem; background: var(--text); animation: caret 1s steps(2) infinite; }
.pw-field .ph { color: var(--muted); font-weight: 500; letter-spacing: 0; }
@keyframes caret { 50% { opacity: 0; } }
.kb { display: flex; flex-direction: column; gap: .55rem; margin-bottom: 1.2rem; }
.kb-row { display: flex; gap: .55rem; }
.kb-key { flex: 1 1 0; min-width: 0; height: 4.4rem; padding: 0; border: 0; border-radius: .8rem; background: var(--glass-2); font-size: calc(1.7rem * var(--fs)); font-weight: 600; cursor: pointer; transition: background .15s ease, color .15s ease, transform .2s var(--spring); }
.kb-key.w2 { flex-grow: 2; } .kb-key.w3 { flex-grow: 3; } .kb-key.w5 { flex-grow: 5; }
.kb-key.alt { background: var(--glass); font-size: calc(1.35rem * var(--fs)); color: var(--text-2); }
.kb-key.go { background: #2f7cf6; color: #fff; }
.kb-key.on { background: var(--text-2); color: var(--focus-fg); }
.kb-key:focus { outline: none; }
.kb-key.is-focus { background: var(--focus-bg); color: var(--focus-fg); transform: scale(1.06); box-shadow: 0 .8rem 1.6rem -.8rem var(--shadow); }
.kb-key .ic { width: 2rem; height: 2rem; margin: 0 auto; }
.pane-grid.wide { grid-template-columns: 22% minmax(0, 1fr); }
.signal { display: inline-flex; align-items: flex-end; gap: .2rem; height: 1.6rem; }
.signal i { width: .32rem; border-radius: 2px; background: currentColor; opacity: .25; }
.signal i:nth-child(1) { height: 30%; } .signal i:nth-child(2) { height: 55%; } .signal i:nth-child(3) { height: 80%; } .signal i:nth-child(4) { height: 100%; }
.signal i.on { opacity: 1; }
.meter { flex: 0 0 14rem; height: .55rem; border-radius: 9px; background: color-mix(in oklab, currentColor 20%, transparent); overflow: hidden; }
.meter i { display: block; height: 100%; background: currentColor; border-radius: 9px; }

/* control center */
.cc-head { margin-bottom: 1.6rem; }
.cc-time { margin: 0; font-size: calc(5rem * var(--fs)); font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.cc-date { margin: .4rem 0 0; font-size: calc(1.7rem * var(--fs)); color: var(--text-2); }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; margin-bottom: 1.2rem; }
.cc-app { display: flex; align-items: center; gap: 1.3rem; margin-bottom: .9rem; }
.cc-app-art { flex: none; display: grid; place-items: center; width: 8.4rem; aspect-ratio: 5 / 3; border-radius: .9rem; background: var(--bg); box-shadow: inset 0 0 0 1px #ffffff14; }
.cc-app-art svg { width: 46%; height: 52%; }
.cc-app-k { margin: 0; font-size: calc(1.25rem * var(--fs)); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.cc-app-n { margin: .1rem 0 0; font-size: calc(2.2rem * var(--fs)); font-weight: 700; letter-spacing: -.02em; }
.cc-app-rows { margin-bottom: 1.2rem; }
.opt.q { flex-direction: column; justify-content: center; gap: .6rem; min-height: 7rem; padding: .9rem .4rem; text-align: center; }
.opt.q > .ic { width: 2.6rem; height: 2.6rem; }
.opt.q .opt-title { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: calc(1.5rem * min(var(--fs), 1.06)); }
/* tuile qui s'allume (mode souris) */
.opt.q.on { background: var(--led); color: #fff; }
.opt.q.on > .ic { color: #fff; }
.opt.q.on.is-focus { background: var(--focus-bg); color: var(--focus-fg); }
.opt.q.on.is-focus > .ic { color: var(--led); }
.pane.side .opts { gap: .45rem; }
.pane.side .opt { min-height: 5.2rem; }
.pane.side .meter { flex-basis: 9rem; }
.pane-main.cc-main { flex: 1; padding-bottom: 2rem; }

/* ---------- ouverture d'une appli ---------- */
.launch {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center;
  background: var(--lbg); color: var(--lfg, #fff);
  clip-path: inset(var(--t, 40%) var(--r, 40%) var(--b, 40%) var(--l, 40%) round 1.15rem);
  transition: clip-path .55s cubic-bezier(.5, 0, .1, 1);
}
.launch.on { clip-path: inset(0 0 0 0 round 0); }
.launch-inner { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; max-width: 52rem; padding: 0 max(16px, env(safe-area-inset-right, 0px)); }
.launch-logo { width: 22rem; height: 13rem; display: grid; place-items: center; transform: scale(.55); transition: transform .6s var(--ease); }
.launch.on .launch-logo { transform: none; }
.launch-logo svg { width: 100%; height: 100%; }
.launch-status { margin: .6rem 0 0; font-size: calc(2rem * var(--fs)); font-weight: 600; opacity: .85; }
.launch-bar { position: relative; width: 16rem; height: .25rem; overflow: hidden; border-radius: 9px; background: color-mix(in oklab, currentColor 22%, transparent); }
.launch-bar i { position: absolute; top: 0; bottom: 0; width: 40%; background: currentColor; border-radius: 9px; animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.launch-note { margin: 0; font-size: calc(1.8rem * var(--fs)); line-height: 1.5; opacity: .9; text-wrap: pretty; }
.launch-fine { margin: 0; font-size: calc(1.45rem * var(--fs)); opacity: .65; }
.launch.ready .launch-bar { display: none; }
.launch:not(.ready):not(.slow) .launch-note, .launch:not(.ready):not(.slow) .launch-fine { display: none; }
.launch-note:empty, .launch-fine:empty { display: none; }
.l-back { display: inline-flex; align-items: center; gap: .7rem; margin-top: 1rem; padding: .9rem 1.7rem .9rem 1rem; font-size: calc(1.65rem * var(--fs)); border: 1px solid color-mix(in oklab, currentColor 30%, transparent); border-radius: 99px; background: color-mix(in oklab, currentColor 8%, transparent); font-weight: 600; cursor: pointer; }
.l-back:focus-visible { outline: .18rem solid currentColor; outline-offset: .2rem; }

/* ---------- démarrage ----------
   Comme sur la maquette du kit : symbole au centre sur fond noir, « scaros » en gris dessous.
   Dans le noir, une lueur se lève ; le symbole sort du flou et se pose. Ses deux fentes
   s'allument en ambre l'une après l'autre, avec un halo qui déborde puis se calme.
   Le mot arrive en se resserrant, puis le logo s'avance et s'efface pendant que l'accueil
   s'ouvre en zoom, comme sur l'Apple TV. Mêmes places que l'écran de démarrage du PC (Plymouth). */
.boot { position: fixed; inset: 0; z-index: 50; background: #000; transition: opacity .85s ease .12s; }
.boot.out { opacity: 0; pointer-events: none; }
.boot-logo { position: absolute; inset: 0; transition: transform 1s cubic-bezier(.4, 0, .2, 1), opacity .7s ease, filter .8s ease; }
.boot.out .boot-logo { transform: scale(1.14); opacity: 0; filter: blur(.7vh); }
.boot-halo { position: absolute; left: 50%; top: 46.25vh; width: 74vh; height: 74vh; margin: -37vh 0 0 -37vh; border-radius: 50%;
  background: radial-gradient(closest-side, #ffffff1c, #ffffff0a 42%, transparent 74%); opacity: 0; transform: scale(.55); }
.boot-sym, .boot-glow { position: absolute; left: 50%; top: 36.1vh; width: 20.3vh; height: 20.3vh; margin-left: -10.15vh; }
.boot-sym { color: #fff; opacity: 0; transform: scale(.86); filter: blur(1.4vh); }
.boot-glow { opacity: 0; filter: blur(1.7vh); }
.boot-sym svg, .boot-glow svg, .boot-word svg { display: block; width: 100%; height: 100%; overflow: visible; }
.boot-word { position: absolute; left: 50%; top: 62.3vh; width: 17.6vh; height: 3.23vh; margin-left: -8.8vh; color: #9a9ca6; opacity: 0; }
.boot .sym-slot { transform: scaleX(0); transform-box: fill-box; }
.boot .sym-slot-a { transform-origin: 100% 50%; }   /* fente du haut : s'ouvre côté droit */
.boot .sym-slot-b { transform-origin: 0% 50%; }     /* fente du bas : s'ouvre côté gauche */
.boot.run .boot-halo { animation: haloIn 2.6s cubic-bezier(.16, 1, .3, 1) .2s forwards; }
.boot.run .boot-sym { animation: symIn 1.35s cubic-bezier(.16, 1, .3, 1) .35s forwards; }
.boot.run .sym-slot-a { animation: slotIn .7s cubic-bezier(.65, 0, .35, 1) 1.2s forwards; }
.boot.run .sym-slot-b { animation: slotIn .7s cubic-bezier(.65, 0, .35, 1) 1.45s forwards; }
.boot.run .boot-glow { animation: glowIn 2.3s ease-out 1.2s forwards; }
.boot.run .boot-word { animation: wordIn 1.2s cubic-bezier(.16, 1, .3, 1) 2.1s forwards; }
@keyframes haloIn { to { opacity: 1; transform: none; } }
@keyframes symIn { 0% { opacity: 0; transform: scale(.86); filter: blur(1.4vh); }
  55% { filter: blur(0); } 100% { opacity: 1; transform: none; filter: blur(0); } }
@keyframes slotIn { to { transform: scaleX(1); } }
@keyframes glowIn { 0% { opacity: 0; } 32% { opacity: .95; } 100% { opacity: .32; } }
@keyframes wordIn { 0% { opacity: 0; transform: translateY(1.1vh) scaleX(1.08); filter: blur(.5vh); color: #4c4e56; }
  100% { opacity: 1; transform: none; filter: blur(0); color: #9a9ca6; } }

/* ---------- veille & extinction ---------- */
.off { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; text-align: center; background: #000; color: var(--text-2); cursor: pointer; overflow: hidden; }
.off.fade { animation: fadeIn 1s ease both; }
.saver-bg { position: absolute; inset: -20%; opacity: .55;
  background: radial-gradient(35% 40% at 30% 40%, #2b3f7a, transparent 70%), radial-gradient(30% 35% at 70% 65%, #5a2b6e, transparent 70%);
  animation: aurora 30s ease-in-out infinite alternate; }
.off[data-kind="off"] .saver-bg, .off[data-kind="off"] .saver-time, .off[data-kind="off"] .saver-date { display: none; }
@keyframes aurora { from { transform: translate3d(-4%, -3%, 0) rotate(0deg); } to { transform: translate3d(4%, 3%, 0) rotate(12deg); } }
.saver { position: relative; }
.saver-time { margin: 0; font-weight: 500; font-size: calc(10rem * var(--fs)); line-height: 1; color: #ffffffd8; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.saver-date { margin: 1rem 0 0; font-size: calc(2.5rem * var(--fs)); font-weight: 600; color: #ffffffa8; text-transform: capitalize; }
.off-msg { margin: 2.4rem 0 0; font-size: calc(1.65rem * var(--fs)); color: var(--muted); }
.off-led { position: absolute; right: max(3rem, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: max(2.4rem, calc(env(safe-area-inset-bottom, 0px) + 16px)); width: .7rem; height: .7rem; border-radius: 50%; background: var(--led); box-shadow: 0 0 .9rem var(--led); }
.blink { position: fixed; inset: 0; z-index: 40; background: #000; opacity: 0; pointer-events: none; }
.blink.run { animation: blinkk .7s ease; }
@keyframes blinkk { 0% { opacity: 0; } 35%, 60% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- notifications & volume ---------- */
.toast {
  position: fixed; z-index: 60; bottom: max(1.2rem, calc(env(safe-area-inset-bottom, 0px) + 12px)); left: 0; right: 0; margin: 0 auto; width: fit-content;
  display: flex; align-items: center; gap: 1.1rem; box-sizing: border-box; max-width: min(48rem, calc(100% - 32px));
  padding: 1rem 1.4rem; border-radius: 1.2rem; background: var(--sheet); border: 1px solid var(--line); box-shadow: 0 1.4rem 3rem -1rem var(--shadow);
  font-size: calc(1.6rem * var(--fs)); font-weight: 500; opacity: 0; transform: translateY(.8rem); transition: opacity .3s ease, transform .35s var(--ease); pointer-events: none;
}
.toast.on { opacity: 1; transform: none; }
/* panneau ouvert : la notification passe en bas à gauche pour ne rien cacher */
.tv.qr-open .toast { top: auto; left: auto; right: max(16px, env(safe-area-inset-right, 0px), 6rem); margin: 0; bottom: max(2.4rem, calc(env(safe-area-inset-bottom, 0px) + 16px)); max-width: min(34rem, calc(100% - 32px)); }
.tv.pane-open:not(.qr-open) .toast { top: auto; right: auto; margin: 0; bottom: max(2.4rem, calc(env(safe-area-inset-bottom, 0px) + 16px)); left: max(16px, env(safe-area-inset-left, 0px), 6rem); max-width: min(26rem, calc(100% - 32px)); }
.toast-ic { flex: none; display: grid; place-items: center; width: 3.2rem; height: 3.2rem; border-radius: .8rem; background: var(--glass-2); }
.toast-ic .ic { width: 1.8rem; height: 1.8rem; }
.vol {
  position: fixed; top: max(1.6rem, env(safe-area-inset-top, 0px)); left: 50%; z-index: 55;
  display: flex; align-items: center; gap: 1.3rem; padding: 1rem 1.8rem 1rem 1.4rem;
  border: 1px solid var(--line); border-radius: 99px; background: var(--sheet); box-shadow: 0 1.4rem 3rem -1rem var(--shadow);
  opacity: 0; transform: translate(-50%, -1rem); transition: opacity .25s ease, transform .3s var(--ease); pointer-events: none;
}
.vol.on { opacity: 1; transform: translate(-50%, 0); }
.vol .ic { width: 2.4rem; height: 2.4rem; }
.vol-track { position: relative; width: 22rem; height: .7rem; overflow: hidden; border-radius: 9px; background: var(--glass-2); }
.vol-track i { position: absolute; inset: 0; background: var(--text); transform-origin: left; transform: scaleX(var(--v, .35)); transition: transform .15s ease; }
.vol.muted .vol-track i { opacity: .25; }
.vol-num { min-width: 4.6rem; text-align: right; font-size: calc(1.8rem * var(--fs)); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- télécommande de démo (maquette) ---------- */
.phone {
  position: fixed; top: 50%; right: max(2.4rem, calc(env(safe-area-inset-right, 0px) + 16px)); z-index: 58;
  display: flex; flex-direction: column; gap: 1.1rem; width: 17rem; box-sizing: border-box;

/* ---------- économiseur d'écran ----------
   « Widgets » (par défaut) : sur un fond noir, une grande horloge à aiguilles, l'heure en chiffres fins,
   la météo, l'air et les UV, la musique en cours (pochette, progression, ◀◀ ⏯ ▶▶) et le match de ton
   équipe. L'ensemble glisse de quelques pixels chaque minute : la télé ne marque pas.
   « Paysages » : le décor de l'accueil en plein écran, qui avance lentement, l'heure dans un coin.

.ss { position: fixed; inset: 0; z-index: 44; color: #fff; cursor: none; }

.tv.screensaver .topbar, .tv.screensaver .rail, .tv.screensaver .apps, .tv.screensaver .foot, .tv.screensaver .home-scrim,

    if (s.app && byId[s.app] && state.launched !== s.app) {
      openOverlay(s.app, true);
      if (s.shown) appShown(s.app);
      api('/api/resume', {}).catch(() => {});
    } else if (!s.app && state.launched) closeLaunch(false);
  }
  function onEvent(m) {
    if (m.type === 'app') onApp(m);
    else if (m.type === 'home') { if (!stopSaver()) { poke(); goHome(); } }
    else if (m.type === 'menu') { if (!stopSaver()) { poke(); toggleControl(); } }
    else if (m.type === 'display') {
      Object.assign(state, { mode: m.mode, hdmi: m.hdmi, output: m.output, res: m.res || null, tvRes: m.tvRes || state.tvRes });
      applyOutput();
      rerenderPane();
    } else if (m.type === 'pad') {
      const was = state.pad;
      state.pad = m.name;
      renderStatus();

      rerenderPane();

      if (state.panel === 'sound' || state.panel === 'control') rerenderPane();

      rerenderPane();

    } else if (m.type === 'wifi') {
      Object.assign(state, { wifiList: m.networks || [], wifiScanning: !!m.scanning, wifi: m.current, ip: m.ip || state.ip });
      renderStatus();
      rerenderPane();
    } else if (m.type === 'wifimsg') {

    } else if (m.type === 'appsmsg') {

      api('/api/state').then(s => { applyState(s); renderTiles(); rerenderPane(); }).catch(() => {});

      rerenderPane();
    } else if (m.type === 'update') {

      if (m.step !== was && m.step === 'failed') toast('alert', 'La mise à jour de Scaros a échoué. Vérifie la connexion, puis réessaie.', 6000);
      if (m.step !== was && m.step === 'done') toast('download', 'Mise à jour installée. L’écran redémarre…', 15000);
      rerenderPane();
    } else if (m.type === 'diag') {
      const was = state.diag.step;
      state.diag = { ...state.diag, ...m };
      if (m.step !== was && m.step === 'done') {

      }

      renderRail();

    } else if (m.type === 'accounts') {
      state.media = { ...state.media, accounts: m.accounts || state.media.accounts };

      state.media = { ...state.media, sport: m.ticker || [], board: m.board || state.media.board || [] };
      renderTicker();
      if (state.tab === 'matches') renderRail();

      }

    } else if (m.type === 'toast') {

    } else if (m.type === 'pair') {

        scanning: ['gamepad', 'Recherche de la manette… Maintiens son bouton d’appairage 3 secondes.', 30000],
        notfound: ['alert', 'Aucune manette trouvée. Réessaie depuis Réglages › Manette.'],
        failed: ['alert', 'L’appairage a échoué. Réessaie depuis Réglages › Manette.'],

  function onApp(m) {
    const t = byId[m.id];
    if (!t) return;

    if (m.state === 'running') { if (state.launched !== m.id) openOverlay(m.id); }
    else if (m.state === 'shown') { if (state.launched === m.id) appShown(m.id); }
    else if (m.state === 'closed') { if (state.launched === m.id) closeLaunch(false); }
    else {
      if (state.launched === m.id) closeLaunch(false);
      if (m.state === 'missing') { state.installed[m.id] = false; renderTiles(); }
      toast('alert', m.state === 'missing'
        ? `${t.name} n’est pas installé. Lance scaros-update pour l’ajouter.`
        : m.state === 'offline'
          ? `${t.name} ne répond pas. Vérifie la connexion internet${t.id === 'scarostv' ? ', ou que le serveur de Scaros TV est allumé' : ''}.`

    }
  }

  // ---------- accueil : onglets, affiches, applis ----------
  // Trois zones, comme sur Google TV : la barre du haut (onglets puis boutons ronds), la rangée
  // d'affiches de l'onglet choisi, et la bande des applis. Haut/bas passent d'une zone à l'autre,
  // gauche/droite avancent dans la zone ; un onglet s'affiche dès qu'il est choisi.
  const TAB_INFO = {
    continue: { name: 'Reprendre', src: 'plex', empty: ['Rien en cours', 'Lance un film ou une série dans Plex : il t’attendra ici.'] },
    recent: { name: 'Ajoutés récemment', src: 'plex', empty: ['Rien de nouveau', 'Les derniers films et séries de ton serveur Plex arriveront ici.'] },
    trending: { name: 'Tendances', src: 'overseerr', empty: ['Pas de tendances', 'Overseerr n’a rien renvoyé pour l’instant.'] },
    requests: { name: 'Mes demandes', src: 'overseerr', empty: ['Aucune demande', 'Choisis un film dans Tendances : un appui sur OK le demande.'] },
    matches: { name: 'Matchs', src: 'sport', empty: ['Pas de match en vue', 'Aucun match prévu prochainement dans tes compétitions. Choisis-les dans Réglages › Sport.'] }
  };
  const SRC = { plex: 'Plex', overseerr: 'Overseerr' };
  const ALL_TABS = Object.keys(TAB_INFO);
  function prefList(key, all) {
    const v = state.prefs[key];

  const tabIndex = () => Math.max(0, headEls().findIndex(el => el.dataset.tab === state.tab));
  const hashHue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

  function railModel(tab) {
    const info = TAB_INFO[tab], m = state.media, acc = (m.accounts || {})[info.src] || {};
    if (info.src === 'sport') {
      const board = m.board || [];
      return board.length ? { items: board, kind: 'match' }
        : { msg: { icon: 'trophy', title: info.empty[0], text: info.empty[1], hint: 'OK : Réglages › Sport', act: 'sport' } };
    }
    const st = (m.status || {})[tab], items = (m.rows || {})[tab];
    if (!acc.connected) return { msg: { icon: info.src === 'plex' ? 'film' : 'download', title: `Connecte ${SRC[info.src]}`,
      text: info.src === 'plex' ? 'Tes films et séries en cours, et les derniers ajouts de ton serveur, s’afficheront ici.'
        : 'Les tendances du moment et tes demandes : un appui sur OK demande un film à Overseerr.', hint: 'OK : Réglages › Comptes', act: 'accounts' } };
    if (st === 'error' && !(items && items.length)) return { msg: { icon: 'alert', title: `${SRC[info.src]} ne répond pas`,
      text: acc.error || 'Vérifie que le serveur est allumé et sur le même réseau.', hint: 'OK : réessayer', act: 'retry' } };
    if (!items) return { skel: true };
    if (!items.length) return { msg: { icon: 'info', title: info.empty[0], text: info.empty[1], hint: '', act: '' } };
    return { items };
  }
  // carte d'un match (onglet Matchs) : compétition, état, les deux équipes et le score
  const fDayShort = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  function matchCardHTML(mt, i) {
    const st = mt.state === 'in' ? `<span class="mc-st onair"><span class="tk-live"></span><span>${esc(mt.clock || 'En direct')}</span></span>`
      : mt.state === 'post' ? `<span class="mc-st"><span>${esc(mt.clock || 'Terminé')}</span></span>` : `<span class="mc-st soon"><span>${esc(matchWhen(mt))}</span></span>`;
    const team = t => `<span class="mc-team">${tkTeam(t)}<span class="nm">${esc(t.name)}</span><b class="sc">${mt.state === 'pre' ? '' : esc(t.score ?? 0)}</b></span>`;
    const d = new Date(mt.start);
    return `<button type="button" class="pc mcard${mt.fav ? ' fav' : ''}" data-i="${i}" role="listitem" tabindex="-1" aria-label="${esc(mt.home.name)} contre ${esc(mt.away.name)}">`
      + `<span class="pc-img mc"><span class="mc-top"><span class="mc-lg">${esc(mt.leagueName || '')}</span>${st}</span>${team(mt.home)}${team(mt.away)}</span>`
      + `<span class="pc-title">${esc(mt.home.name)} – ${esc(mt.away.name)}</span>`
      + `<span class="pc-sub">${mt.fav ? '★ ' : ''}${isNaN(d) ? '' : esc(fDayShort.format(d))}</span></button>`;
  }
  function cardHTML(it, i, wide) {
    const img = wide ? (it.art || it.poster) : (it.poster || it.art);
    const badge = it.badge ? `<span class="pc-badge${/^Disponible/.test(it.badge) ? ' ok' : ''}">${esc(it.badge)}</span>` : '';
    const prog = it.progress ? `<span class="pc-prog"><i style="width:${Math.max(3, Math.round(it.progress * 100))}%"></i></span>` : '';
    return `<button type="button" class="pc${wide ? ' wide' : ''}" data-i="${i}" role="listitem" tabindex="-1" aria-label="${esc(it.title)}">`
      + `<span class="pc-img"><span class="pc-ph" style="--h:${it.hue ?? hashHue(it.title)}">${esc(it.title)}</span>`
      + `${img ? `<img src="${esc(img)}" alt="" decoding="async">` : ''}${badge}${prog}</span>`
      + `<span class="pc-title">${esc(it.title)}</span><span class="pc-sub">${esc(it.sub || it.meta || '')}</span></button>`;
  }
  let railKey = '', railTx = 0;
  function renderRail(force) {
    const tab = state.tab, m = railModel(tab), track = $('#rail-track');
    const key = tab + '|' + JSON.stringify(m);
    if (!force && key === railKey) return;
    const sameTab = railKey.split('|')[0] === tab;
    railKey = key;
    state.railModel = m;
    if (m.items && m.kind === 'match') track.innerHTML = m.items.map(matchCardHTML).join('');
    else if (m.items) track.innerHTML = m.items.map((it, i) => cardHTML(it, i, i === 0)).join('');
    else if (m.skel) track.innerHTML = Array.from({ length: 7 }, (_, i) => `<div class="pc skel${i ? '' : ' wide'}"><span class="pc-img"></span></div>`).join('');
    else track.innerHTML = `<button type="button" class="pc msg" data-i="0" tabindex="-1"><span class="pc-msg">${icon(m.msg.icon)}<b>${esc(m.msg.title)}</b>`
      + `<span>${esc(m.msg.text)}</span>${m.msg.hint ? `<em>${esc(m.msg.hint)}</em>` : ''}</span></button>`;
    const n = railEls().length;
    state.railIdx[tab] = Math.min(state.railIdx[tab] || 0, Math.max(0, n - 1));
    if (!sameTab) railTx = 0;
    if (state.zone === 'rail' && !n) state.zone = 'head';
    paintFocus(false);
    scrollRail(true);
  }
  function scrollRail(instant) {
    const track = $('#rail-track'), els = railEls(), el = els[state.railIdx[state.tab] || 0];
    if (!el) { railTx = 0; track.style.transform = ''; return; }
    const rail = $('#rail'), pad = parseFloat(getComputedStyle(rail).paddingLeft) || 0;
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 10;
    const view = rail.clientWidth - pad - 4 * rem;
    const left = el.offsetLeft - els[0].offsetLeft, right = left + el.offsetWidth;
    if (right - railTx > view) railTx = right - view;
    if (left - railTx < 0) railTx = left;
    if (instant) track.style.transition = 'none';
    track.style.transform = railTx ? `translateX(${-railTx}px)` : '';
    if (instant) { void track.offsetWidth; track.style.transition = ''; }
  }
  let appsTx = 0;
  function scrollApps(instant) {
    const box = $('#icons'), els = appEls(), el = els.find(e => e.dataset.id === state.focus);
    if (!el) return;
    const wrap = $('.apps'), pad = parseFloat(getComputedStyle(wrap).paddingLeft) || 0;
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 10;
    const view = wrap.clientWidth - pad - 4 * rem;
    const left = el.offsetLeft - els[0].offsetLeft, right = left + el.offsetWidth;
    if (right - appsTx > view) appsTx = right - view;
    if (left - appsTx < 0) appsTx = left;
    if (instant) box.style.transition = 'none';
    box.style.transform = appsTx ? `translateX(${-appsTx}px)` : '';
    if (instant) { void box.offsetWidth; box.style.transition = ''; }
  }
  function renderTabs() {
    const tabs = visibleTabs();
    if (!tabs.includes(state.tab)) state.tab = tabs[0];
    $('#tabs').innerHTML = tabs.map(t => `<button type="button" class="tab${t === state.tab ? ' on' : ''}" data-tab="${t}" tabindex="-1">${TAB_INFO[t].name}</button>`).join('');
    state.headIdx = Math.min(state.headIdx, headEls().length - 1);
  }
  function renderApps() {
    const list = dockList();
    $('#icons').innerHTML = list.map(t => `<button type="button" class="icon" role="listitem" id="t-${t.id}" data-id="${t.id}" tabindex="-1" aria-label="${t.name}">`
      + `<span class="icon-art" style="--bg:${t.bg}">${ART[t.id]()}<span class="badge" hidden>À installer</span></span><span class="icon-name">${t.name}</span></button>`).join('');
    if (!list.some(t => t.id === state.focus)) state.focus = list[0].id;
    renderTiles();
    appsTx = Math.min(appsTx, 0) || 0;
    scrollApps(true);
  }
  function renderTiles() {
    appEls().forEach(el => { el.querySelector('.badge').hidden = !(state.live && state.installed[el.dataset.id] === false); });
  }
  function renderHome() { renderTabs(); renderApps(); renderRail(true); renderTicker(); }

  function curEl() {
    const els = zoneEls(state.zone);
    if (state.zone === 'apps') return els.find(el => el.dataset.id === state.focus) || els[0];
    if (state.zone === 'wid') return els[Math.min(state.widIdx || 0, els.length - 1)];
    return els[state.zone === 'head' ? state.headIdx : (state.railIdx[state.tab] || 0)] || els[0];
  }
  function paintFocus(takeDom = true) {
    document.querySelectorAll('.stage .is-focus').forEach(el => el.classList.remove('is-focus'));
    stage.dataset.zone = state.zone;
    const el = curEl();
    if (el) {
      el.classList.add('is-focus');
      if (takeDom && !state.panel && !state.launched && !state.saver && document.activeElement !== el) el.focus({ preventScroll: true });
      if (state.zone === 'rail') scrollRail();
      if (state.zone === 'apps') scrollApps();
    }
    updateBackdrop();
  }
  function focusZone(z, idx) {
    state.zone = z;
    if (z === 'head' && idx != null) state.headIdx = idx;
    if (z === 'rail' && idx != null) state.railIdx[state.tab] = idx;
    paintFocus();
  }
  // une tuile d'appli (touches 1 à 6, retour d'une appli…)
  function setFocus(id, takeDom = true) {
    if (id && appEls().some(el => el.dataset.id === id)) state.focus = id;
    state.zone = 'apps';
    paintFocus(takeDom);
  }
  function nearest(from, dir, list) {
    const a = from.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    let best = null, score = Infinity;
    for (const el of list) {
      if (el === from) continue;
      const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
      let main, cross;
      if (dir === 'right') { if (dx <= 4) continue; main = dx; cross = Math.abs(dy); }
      else if (dir === 'left') { if (dx >= -4) continue; main = -dx; cross = Math.abs(dy); }
      else if (dir === 'down') { if (dy <= 4) continue; main = dy; cross = Math.abs(dx); }
      else { if (dy >= -4) continue; main = -dy; cross = Math.abs(dx); }
      if ((dir === 'left' || dir === 'right') && cross > a.height * .6) continue;
      const sc = main + cross * 2.2;
      if (sc < score) { score = sc; best = el; }
    }
    return best;
  }
  function bumpEl(el, dir) {
    if (!el) return;
    el.style.setProperty('--bx', dir === 'left' ? '-.6rem' : dir === 'right' ? '.6rem' : '0');
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 340);
  }
  function move(dir) {
    const z = state.zone, els = zoneEls(z), el = curEl(), i = els.indexOf(el);
    if (dir === 'left' || dir === 'right') {
      const j = i + (dir === 'right' ? 1 : -1);
      if (j < 0 || j >= els.length) return bumpEl(el, dir);
      if (z === 'wid') state.widIdx = j;
      else if (z === 'head') {
        state.headIdx = j;
        const t = els[j].dataset.tab;
        if (t && t !== state.tab) { state.tab = t; renderTabs(); renderRail(); }
      } else if (z === 'rail') state.railIdx[state.tab] = j;
      else state.focus = els[j].dataset.id;
      return paintFocus();
    }
    if (dir === 'up') {
      if (z === 'apps') return railEls().length ? focusZone('rail') : focusZone('head', tabIndex());
      if (z === 'rail') return focusZone('head', tabIndex());
      if (z === 'head' && widEls().length) {  // vers les widgets : celui qui est au-dessus
        const r = el.getBoundingClientRect(), x = r.left + r.width / 2, ws = widEls();
        let best = 0, bd = Infinity;
        ws.forEach((w, k) => { const b = w.getBoundingClientRect(), dd = Math.abs(b.left + b.width / 2 - x); if (dd < bd) { bd = dd; best = k; } });
        state.widIdx = best;
        return focusZone('wid');
      }
      return bumpEl(el, dir);
    }
    if (z === 'wid') return focusZone('head', tabIndex());
    if (z === 'head') return railEls().length ? focusZone('rail') : focusZone('apps');
    if (z === 'rail') return focusZone('apps');
    return bumpEl(el, dir);
  }
  function okHome() {
    const el = curEl();
    if (!el) return;
    if (state.zone === 'apps') return launch(el.dataset.id);
    if (state.zone === 'wid') {
      const w = el.dataset.wg;
      if (w === 'match' && state.wgMatch) return openMatch(state.wgMatch);
      if (w === 'music') return npControl('toggle');
      return openPanel('ambiance');
    }
    if (state.zone === 'head') {
      if (el.dataset.tab) return railEls().length ? focusZone('rail') : focusZone('apps');
      const r = el.dataset.round;
      return r === 'control' ? toggleControl() : openPanel(r);
    }
    const m = state.railModel || {};
    if (m.kind === 'match') return openMatch(m.items[Number(el.dataset.i)]);
    if (m.msg) {

  const PAGE_NAME = { settings: 'Réglages', display: 'Écran', sound: 'Son', bluetooth: 'Bluetooth', btdevice: 'Appareil', controller: 'Manette',
    remote: 'Télécommande', wifi: 'Wi-Fi', ambiance: 'Fond et météo', citysearch: 'Ville', cityresults: 'Résultats',
    airplay: 'AirPlay', update: 'Mise à jour', netdiag: 'Diagnostic réseau', wifinetwork: 'Réseau', wifipass: 'Mot de passe', general: 'Affichage', apps: 'Applis',
    accounts: 'Comptes', home: 'Accueil', hometabs: 'Onglets', homeapps: 'Applis de la bande', saver: 'Écran de veille', sport: 'Sport',
    sportpick: 'Ajouter une équipe', sportteams: 'Équipes', item: 'Fiche',
    store: 'App Store', storeapp: 'Appli', weburl: 'Site web', webname: 'Nom', match: 'Match', homewidgets: 'Widgets du haut',
    power: 'Alimentation', about: 'À propos', control: 'Centre de contrôle' };

  const currentAct = () => state.pItems[state.pIdx] && state.pItems[state.pIdx].dataset.act;
  function renderPanel(keepAct) {
    const p = PAGES[state.panel]();
    // même page redessinée (liste Bluetooth, Wi-Fi…) : on garde l'endroit où on lisait
    const oldBox = pane.dataset.page === state.panel && pane.querySelector('.pane-main, .qr-side');
    const oldTop = oldBox ? oldBox.scrollTop : 0;
    pane.dataset.page = state.panel;
    pane.classList.toggle('side', !!p.side);
    pane.classList.toggle('qrs', !!p.qrscreen);
    $('#tv').classList.toggle('qr-open', !!p.qrscreen);
    if (p.side || p.qrscreen) {
      pane.style.removeProperty('--pa');
      pane.innerHTML = p.body;
    } else {
      pane.style.setProperty('--pa', p.pa);
      const trail = [...state.panelStack.map(s => s.id), state.panel].filter(id => id !== 'control').map(id => PAGE_NAME[id]);
      const art = p.img !== undefined ? `<span class="pc-ph" style="--h:${p.hue || 220}">${p.title}</span>${p.img ? `<img src="${esc(p.img)}" alt="" onerror="this.remove()">` : ''}`
        : p.mark ? symbolSVG('mark') : p.art ? ART[p.art]() : icon(p.icon);
      pane.innerHTML = `<p class="crumbs">${trail.slice(0, -1).map(t => `${t} › `).join('')}<b>${trail[trail.length - 1]}</b></p>
        <div class="pane-grid${p.wide ? ' wide' : ''}">
          <div class="pane-art"><div class="art-tile${p.img !== undefined ? ' poster' : ''}" style="--pa:${p.pa};--pb:${p.pb}${p.mark ? ';background:none;box-shadow:none' : ''}">${art}</div><p class="art-caption">${p.caption || ''}</p></div>
          <div class="pane-main"><h2 class="pane-title">${p.title}</h2>${p.lead ? `<p class="pane-lead">${p.lead}</p>` : '<div style="height:2rem"></div>'}${p.body}</div>
        </div>`;
    }
    state.pItems = [...pane.querySelectorAll('[data-act]:not([disabled])')];
    const newBox = pane.querySelector('.pane-main, .qr-side');
    if (newBox && oldTop) newBox.scrollTop = oldTop;
    const pm = pane.querySelector('.pane-main');
    if (pm) pm.addEventListener('scroll', () => markMore(pm), { passive: true });
    const i = keepAct ? state.pItems.findIndex(el => el.dataset.act === keepAct) : 0;
    setPIdx(Math.max(0, i));
    if (pm) markMore(pm);
  }
  function markMore(pm) { pm.classList.toggle('more', pm.scrollTop + pm.clientHeight < pm.scrollHeight - 6); }
  function rerenderPane() { if (state.panel) renderPanel(currentAct()); }
  function setPIdx(i) {
    state.pIdx = i;
    state.pItems.forEach((el, k) => el.classList.toggle('is-focus', k === i));
    const el = state.pItems[i];
    if (!el) return;
    el.focus({ preventScroll: true });
    // premier réglage : on remonte tout en haut (titre, état) ; dernier : on montre aussi ce qui suit
    // (aide, liste des boutons…). Toujours sans perdre de vue le réglage choisi.

      repeat('right', b(15) || x > .55, now);
      edge('a', b(0), 'ok'); edge('b', b(1), 'back'); edge('guide', b(16), 'home'); edge('start', b(9), 'menu');
      edge('lb', b(4), 'voldown'); edge('rb', b(5), 'volup');
    }
    if (polling) requestAnimationFrame(padLoop);
  }
  addEventListener('gamepadconnected', e => {
    if (!browserPad()) return;
    state.pad = e.gamepad.id; renderStatus();
    toast('gamepad', /xbox|xinput|045e/i.test(e.gamepad.id) ? 'Manette Xbox connectée.' : 'Manette connectée.');
    if (!polling) { polling = true; padLoop(); }
  });
  addEventListener('gamepaddisconnected', () => {
    if (!browserPad()) return;
    const left = pads();
    state.pad = left.length ? left[0].id : null;
    if (!left.length) polling = false;
    renderStatus(); toast('gamepad', 'Manette déconnectée.');
  });

  // horloge
  function tick() {
    const d = new Date(), c = clockParts(d);
    $('#clock').textContent = `${c.h}:${c.m}`;
    $('#clock-ap').textContent = c.ap;
    $('#tb-date').innerHTML = `<b>${esc(fWeekday.format(d))}</b>${esc(fDay.format(d))}`;
    $('#sleep-clock').textContent = fT.format(d);
    $('#sleep-date').textContent = fD.format(d);
    const cc = pane.querySelector('.cc-time');
    if (cc) cc.textContent = fT.format(d);
    if (state.prefs.theme === 'auto') applyPrefs();  // bascule clair/sombre à 7 h et 19 h
    applySky();  // aube, journée, soir : le décor suit l'heure
  }
  tick(); setInterval(tick, 10000);

  // démarrage
  applyOutput(true);
  updateHints();
  renderStatus();
  state.zone = 'rail';
  renderHome();
  paintFocus(false);
  boot();
  connect().then(live => {
    audioReady = true;
    if (!live) return;
    renderAll();
    listen();
    syncApp(firstState);
  });
})();
</script>
</html>
