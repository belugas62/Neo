<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scaros OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- fonts:local -->
<style>
@font-face { font-family: "Figtree"; src: url("fonts/figtree.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "Unbounded"; src: url("fonts/unbounded.woff2") format("woff2"); font-weight: 300 600; font-display: swap; }
</style>
<!-- /fonts:local -->
<style>
/* Layout: 10-foot home screen — a cinematic "shelf" for the focused app fills the top,
   a single row of label-less app icons sits under it; Réglages open full screen,
   the control center slides in from the right. */
:root {
  --ink: #05070b;
  --ink-2: #0d1118;
  --glass: #ffffff12;
  --glass-2: #ffffff1f;
  --line: #ffffff1c;
  --text: #f3f5f9;
  --text-2: #c6cbd5;
  --muted: #8a91a0;
  --focus-bg: #f3f5f9;
  --focus-fg: #0b0d12;
  --focus-muted: #4c5260;
  --led: #ff3b30;
  --pad-a: #6cc04a;
  --pad-b: #e5484d;
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-brand: "Unbounded", "Figtree", system-ui, sans-serif;
  --u: min(1vw, 1.7778vh);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.3, 1.3, .45, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
html { font-size: var(--u); background: #000; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--font); font-size: 1.15rem; line-height: 1.4;
  overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.ic { display: block; width: 1.4rem; height: 1.4rem; flex: none; }

/* ---------- home ---------- */
.tv { position: relative; height: 100%; overflow: hidden; background: #000; }
.stage { position: relative; height: 100%; background: var(--ink); transition: opacity .6s ease, filter .6s ease; }
.stage.off-anim { opacity: 0; filter: brightness(.3); }

.shelf { position: absolute; inset: 0 0 auto; height: 66%; overflow: hidden; }
.scene {
  position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease;
  background:
    radial-gradient(60% 85% at 76% 38%, color-mix(in oklab, var(--a) 46%, transparent), transparent 70%),
    radial-gradient(55% 70% at 8% 108%, color-mix(in oklab, var(--b) 70%, transparent), transparent 72%),
    linear-gradient(180deg, color-mix(in oklab, var(--b) 35%, var(--ink)) 0%, var(--ink) 100%);
}
.scene.on { opacity: 1; }
.scene::before {
  content: ""; position: absolute; inset: 0; opacity: .5;
  background: linear-gradient(115deg, transparent 38%, #ffffff10 48%, transparent 58%);
}
.scene-art { position: absolute; right: 9rem; top: 5.6rem; width: 26rem; height: 19rem; display: grid; place-items: center; }
.scene-art svg { width: 100%; height: 100%; filter: drop-shadow(0 2.4rem 4rem color-mix(in oklab, var(--a) 50%, transparent)); }
.scene.on .scene-art { animation: float 9s ease-in-out infinite alternate; }
@keyframes float { from { transform: translateY(-.6rem) rotate(-1.5deg); } to { transform: translateY(.6rem) rotate(1.5deg); } }
.shelf-fade { position: absolute; inset: 0 0 auto; height: 66%; pointer-events: none; background: linear-gradient(180deg, transparent 45%, var(--ink) 100%), linear-gradient(90deg, #05070bcc 0%, transparent 55%); }

.status {
  position: absolute; top: 2.4rem; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  padding-left: max(16px, env(safe-area-inset-left, 0px), 6rem);
  padding-right: max(16px, env(safe-area-inset-right, 0px), 6rem);
}
.brand { display: flex; align-items: center; gap: .9rem; opacity: .9; }
.brand .mark { width: 2.5rem; height: 2.5rem; }
.brand-word { font-family: var(--font-brand); font-weight: 500; font-size: 1.35rem; letter-spacing: -.01em; }
.status-right { display: flex; align-items: center; gap: 1.4rem; color: var(--text-2); }
.st { display: grid; place-items: center; transition: opacity .3s; }
.st .ic { width: 1.35rem; height: 1.35rem; }
.st.dim { opacity: .35; }
.clock { font-size: 1.55rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.shelf-info {
  position: absolute; z-index: 2; top: 20rem; max-width: 46rem;
  left: max(16px, env(safe-area-inset-left, 0px), 6rem);
}
.shelf-info.in { animation: infoIn .5s var(--ease); }
@keyframes infoIn { from { opacity: 0; transform: translateY(.6rem); } }
.kicker { margin: 0; font-size: .95rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text-2); }
.shelf-desc { margin: .7rem 0 0; font-size: 1.85rem; font-weight: 600; line-height: 1.25; letter-spacing: -.015em; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.2rem 0 0; padding: 0; list-style: none; }
.chips li { padding: .35rem .85rem; font-size: .92rem; font-weight: 600; color: var(--text-2); background: var(--glass); border: 1px solid var(--line); border-radius: 99px; }
.chips li.warn { color: var(--focus-fg); background: var(--text-2); border-color: transparent; }

.dock {
  position: absolute; z-index: 2; top: 34.6rem; left: 0; right: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px), 6rem);
  padding-right: max(16px, env(safe-area-inset-right, 0px), 6rem);
}
.icons { display: flex; gap: 2.6rem; perspective: 60rem; }
.icon { position: relative; flex: none; width: 15.4rem; padding: 0; margin: 0; border: 0; background: none; cursor: pointer; }
.icon:focus { outline: none; }
.icon-art {
  position: relative; display: grid; place-items: center; overflow: hidden;
  aspect-ratio: 5 / 3; border-radius: 1.15rem; background: var(--bg);
  box-shadow: 0 .8rem 1.6rem -1rem #000000b0, inset 0 0 0 1px #ffffff14;
  transition: transform .35s var(--spring), box-shadow .35s ease;
}
.icon-art svg { width: 46%; height: 52%; }
.icon[data-id="youtube"] .icon-art svg { width: 40%; }
.icon-art::after {
  content: ""; position: absolute; inset: -40%; pointer-events: none;
  background: linear-gradient(120deg, transparent 40%, #ffffff40 50%, transparent 60%);
  transform: translateX(-60%); opacity: 0;
}
.icon.is-focus .icon-art {
  transform: translateY(-.7rem) scale(1.12);
  box-shadow: 0 2.6rem 3.4rem -1.2rem #000000d8, 0 0 0 .18rem #ffffffe0;
  animation: tilt 5s ease-in-out .4s infinite alternate;
}
.icon.is-focus .icon-art::after { animation: shine 1.1s ease .1s 1; }
@keyframes tilt {
  0% { transform: translateY(-.7rem) scale(1.12) rotateX(2deg) rotateY(-3deg); }
  100% { transform: translateY(-.7rem) scale(1.12) rotateX(-2deg) rotateY(3deg); }
}
@keyframes shine { 0% { opacity: 1; transform: translateX(-60%); } 100% { opacity: 1; transform: translateX(60%); } }
.icon.bump .icon-art { animation: bump .32s ease; }
@keyframes bump { 40% { transform: translateY(-.7rem) scale(1.12) translateX(var(--bx, 0)); } }
.icon-name {
  position: absolute; left: 50%; top: calc(100% + 1.6rem); transform: translateX(-50%);
  white-space: nowrap; font-size: 1.2rem; font-weight: 600; opacity: 0; transition: opacity .25s ease;
}
.icon.is-focus .icon-name { opacity: 1; }
.badge { position: absolute; right: .7rem; top: .7rem; z-index: 1; padding: .15rem .5rem; font-size: .75rem; font-weight: 700; color: var(--focus-fg); background: var(--text-2); border-radius: .35rem; }

.foot {
  position: absolute; bottom: 2rem; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; font-size: .95rem; color: var(--muted);
  padding-left: max(16px, env(safe-area-inset-left, 0px), 6rem);
  padding-right: max(16px, env(safe-area-inset-right, 0px), 6rem);
}
.ver { font-size: .85rem; }
.hint-list { display: flex; gap: 1.8rem; }
.hint { display: flex; align-items: center; gap: .55rem; }
.bg { display: inline-grid; place-items: center; min-width: 1.6rem; height: 1.6rem; padding: 0 .1rem; box-sizing: border-box; border-radius: 99px; font-size: .82rem; font-weight: 700; color: var(--ink); }
.bg .ic { width: 1rem; height: 1rem; }
.g-a { background: var(--pad-a); }
.g-b { background: var(--pad-b); }
.g-menu { background: var(--text); }
.g-num { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 0 .5rem; border-radius: .4rem; font-variant-numeric: tabular-nums; }

.stage.enter .shelf { animation: fadeIn .9s ease both; }
.stage.enter .status { animation: rise .8s var(--ease) .1s both; }
.stage.enter .shelf-info { animation: rise .8s var(--ease) .18s both; }
.stage.enter .dock { animation: rise .8s var(--ease) .26s both; }
.stage.enter .foot { animation: fadeIn .8s ease .4s both; }
@keyframes rise { from { opacity: 0; transform: translateY(1.6rem); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Réglages (plein écran) & centre de contrôle ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: #000; opacity: 0; transition: opacity .35s ease; }
.scrim.on { opacity: .62; }
.pane {
  position: fixed; z-index: 21; inset: 0; box-sizing: border-box; display: flex; flex-direction: column;
  background: radial-gradient(70% 60% at 22% 40%, color-mix(in oklab, var(--pa, #6b7385) 22%, transparent), transparent 70%), var(--ink-2);
  padding: max(2.6rem, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px), 6rem) 2.4rem max(16px, env(safe-area-inset-left, 0px), 6rem);
  opacity: 0; transform: scale(1.03); transition: opacity .35s ease, transform .45s var(--ease);
}
.pane.on { opacity: 1; transform: none; }
.pane.side {
  inset: 1.6rem max(1.6rem, env(safe-area-inset-right, 0px)) 1.6rem auto; width: 36rem; border-radius: 2rem;
  padding: 2.4rem 2rem; background: #12161ef2; border: 1px solid var(--line); box-shadow: 0 2rem 5rem -1rem #000;
  transform: translateX(110%);
}
.pane.side.on { transform: none; }
.crumbs { margin: 0; font-size: 1rem; font-weight: 600; color: var(--muted); }
.crumbs b { color: var(--text-2); font-weight: 600; }
.pane-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 36% minmax(0, 1fr); gap: 4rem; margin-top: 1.6rem; }
.pane-art { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.8rem; }
.art-tile {
  display: grid; place-items: center; width: 17rem; height: 17rem; border-radius: 3.8rem;
  background: linear-gradient(160deg, var(--pa, #8a92a3), var(--pb, #3b414d));
  box-shadow: 0 3rem 5rem -2rem #000000c0, inset 0 1px 0 #ffffff40; color: #fff;
}
.art-tile .ic { width: 8rem; height: 8rem; stroke-width: 1.6; }
.art-tile > svg:not(.ic) { width: 60%; height: 60%; }
.art-tile svg.mark { width: 100%; height: 100%; }
.art-caption { margin: 0; max-width: 24rem; text-align: center; font-size: 1.05rem; color: var(--muted); }
.pane-main { min-height: 0; overflow-y: auto; padding: 1rem 1.2rem 2rem; margin: -1rem -1.2rem 0; scrollbar-width: none; }
.pane-main::-webkit-scrollbar { display: none; }
.pane-title { margin: 0; font-size: 3rem; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; }
.pane-lead { margin: .7rem 0 2rem; max-width: 44rem; font-size: 1.2rem; color: var(--text-2); }
.opts { display: flex; flex-direction: column; gap: .55rem; }
.opt {
  display: flex; align-items: center; gap: 1.2rem; width: 100%; min-height: 4.4rem; box-sizing: border-box;
  padding: .8rem 1.5rem; margin: 0; border: 0; border-radius: 1rem; background: var(--glass);
  text-align: left; cursor: pointer; transition: background .2s ease, color .2s ease, transform .25s var(--spring), box-shadow .25s ease;
}
.opt:focus { outline: none; }
.opt > .ic { width: 1.6rem; height: 1.6rem; color: var(--text-2); }
.opt.is-focus { background: var(--focus-bg); color: var(--focus-fg); transform: scale(1.025); box-shadow: 0 1.2rem 2.4rem -1rem #000000b0; }
.opt.is-focus > .ic, .opt.is-focus .opt-desc, .opt.is-focus .opt-val { color: var(--focus-muted); }
.opt[disabled] { cursor: default; opacity: .4; }
.opt-main { display: flex; flex-direction: column; gap: .15rem; flex: 1; min-width: 0; }
.opt-title { font-size: 1.25rem; font-weight: 600; }
.opt-desc { font-size: 1rem; color: var(--muted); }
.opt-val { flex: none; font-size: 1.1rem; color: var(--text-2); white-space: nowrap; }
.chev { flex: none; width: 1.3rem; height: 1.3rem; color: var(--muted); }
.opt.is-focus .chev { color: var(--focus-muted); }
.check { flex: none; width: 1.6rem; height: 1.6rem; color: var(--text); opacity: 0; }
.opt[aria-checked="true"] .check { opacity: 1; }
.opt.is-focus .check { color: var(--focus-fg); }
.opt-group { margin: 2rem 0 .6rem; padding: 0 .4rem; font-size: .9rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.opt-group:first-child { margin-top: 0; }
.opt-empty, .note { margin: 0; padding: .4rem .4rem; font-size: 1.05rem; color: var(--muted); }
.card { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.6rem; padding: 1.3rem 1.5rem; border-radius: 1.1rem; background: var(--glass); border: 1px solid var(--line); }
.sdot { flex: none; width: .8rem; height: .8rem; border-radius: 50%; background: var(--muted); }
.sdot.on { background: var(--pad-a); box-shadow: 0 0 .8rem var(--pad-a); }
.card-title { font-weight: 600; font-size: 1.2rem; }
.card-sub { font-size: 1rem; color: var(--muted); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: .9rem 2.4rem; margin: 0 0 2rem; padding: 1.5rem; border-radius: 1.1rem; background: var(--glass); }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.spin { display: inline-block; width: 1.3rem; height: 1.3rem; box-sizing: border-box; border: .17rem solid #ffffff33; border-top-color: currentColor; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.remote-grid { display: grid; grid-template-columns: auto 1fr; gap: 2.4rem; align-items: center; margin-bottom: 2rem; }
.qr-card { display: flex; flex-direction: column; align-items: center; gap: .8rem; }
.qr-card svg, .qr-card img { display: block; width: 13rem; height: 13rem; border-radius: 1rem; background: #fff; }
.qr-addr { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-2); }
.steps { display: flex; flex-direction: column; gap: 1.1rem; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: flex; gap: 1rem; font-size: 1.12rem; color: var(--text-2); counter-increment: s; }
.steps li::before { content: counter(s); flex: none; display: grid; place-items: center; width: 1.9rem; height: 1.9rem; font-weight: 700; font-size: .95rem; color: var(--text); border: 1px solid var(--line); border-radius: 50%; }
kbd { font-family: var(--font); font-weight: 700; padding: .05rem .45rem; border: 1px solid var(--line); border-radius: .35rem; }

/* control center */
.cc-head { margin-bottom: 1.6rem; }
.cc-time { margin: 0; font-size: 4.2rem; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.cc-date { margin: .4rem 0 0; font-size: 1.15rem; color: var(--text-2); }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7rem; margin-bottom: 1.4rem; }
.opt.q { flex-direction: column; justify-content: center; gap: .7rem; min-height: 7.4rem; padding: 1rem .6rem; text-align: center; }
.opt.q > .ic { width: 2rem; height: 2rem; }
.opt.q .opt-title { font-size: 1.05rem; }
.pane.side .opts { gap: .45rem; }
.pane.side .opt { min-height: 4rem; }

/* ---------- ouverture d'une appli ---------- */
.launch {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center;
  background: var(--lbg); color: var(--lfg, #fff);
  clip-path: inset(var(--t, 40%) var(--r, 40%) var(--b, 40%) var(--l, 40%) round 1.15rem);
  transition: clip-path .55s cubic-bezier(.5, 0, .1, 1);
}
.launch.on { clip-path: inset(0 0 0 0 round 0); }
.launch-inner { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; max-width: 52rem; padding: 0 max(16px, env(safe-area-inset-right, 0px)); }
.launch-logo { width: 22rem; height: 13rem; display: grid; place-items: center; transform: scale(.55); transition: transform .6s var(--ease); }
.launch.on .launch-logo { transform: none; }
.launch-logo svg { width: 100%; height: 100%; }
.launch-status { margin: .6rem 0 0; font-size: 1.3rem; font-weight: 600; opacity: .85; }
.launch-bar { position: relative; width: 16rem; height: .25rem; overflow: hidden; border-radius: 9px; background: color-mix(in oklab, currentColor 22%, transparent); }
.launch-bar i { position: absolute; top: 0; bottom: 0; width: 40%; background: currentColor; border-radius: 9px; animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.launch-note { margin: 0; font-size: 1.2rem; line-height: 1.5; opacity: .9; text-wrap: pretty; }
.launch-fine { margin: 0; font-size: 1rem; opacity: .65; }
.launch.ready .launch-bar { display: none; }
.launch:not(.ready) .launch-note, .launch:not(.ready) .launch-fine { display: none; }
.l-back { display: inline-flex; align-items: center; gap: .7rem; margin-top: 1rem; padding: .7rem 1.3rem .7rem .8rem; border: 1px solid color-mix(in oklab, currentColor 30%, transparent); border-radius: 99px; background: color-mix(in oklab, currentColor 8%, transparent); font-weight: 600; cursor: pointer; }
.l-back:focus-visible { outline: .18rem solid currentColor; outline-offset: .2rem; }

/* ---------- démarrage ---------- */
.boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #000; transition: opacity .7s ease; }
.boot.out { opacity: 0; pointer-events: none; }
.boot-logo { display: flex; align-items: center; }
.boot .mark { width: 9rem; height: 9rem; opacity: 0; transform: scale(.86); }
.boot-word { overflow: hidden; max-width: 0; opacity: 0; white-space: nowrap; font-family: var(--font-brand); font-weight: 500; font-size: 5rem; letter-spacing: -.01em; line-height: 1; }
.boot-word span { display: inline-block; padding-left: 2.2rem; }
.boot.run .mark { animation: markIn 1s var(--ease) .25s forwards; }
.boot.run .mark .sweep { animation: sweep 1.2s ease .7s forwards; }
.boot.run .mark .led { opacity: 0; animation: ledOn .5s steps(2) 1.25s forwards; }
.boot.run .boot-word { animation: wordIn .9s var(--ease) 1.25s forwards; }
@keyframes markIn { to { opacity: 1; transform: none; } }
@keyframes sweep { from { transform: translateX(-70px); } to { transform: translateX(70px); } }
@keyframes ledOn { to { opacity: 1; } }
@keyframes wordIn { to { max-width: 34rem; opacity: 1; } }

/* ---------- veille & extinction ---------- */
.off { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; text-align: center; background: #000; color: var(--text-2); cursor: pointer; overflow: hidden; }
.off.fade { animation: fadeIn 1s ease both; }
.saver-bg { position: absolute; inset: -20%; opacity: .55;
  background: radial-gradient(35% 40% at 30% 40%, #2b3f7a, transparent 70%), radial-gradient(30% 35% at 70% 65%, #5a2b6e, transparent 70%);
  animation: aurora 30s ease-in-out infinite alternate; }
.off[data-kind="off"] .saver-bg, .off[data-kind="off"] .saver-time, .off[data-kind="off"] .saver-date { display: none; }
@keyframes aurora { from { transform: translate3d(-4%, -3%, 0) rotate(0deg); } to { transform: translate3d(4%, 3%, 0) rotate(12deg); } }
.saver { position: relative; }
.saver-time { margin: 0; font-family: var(--font-brand); font-weight: 300; font-size: 10rem; line-height: 1; color: #ffffffd8; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.saver-date { margin: 1rem 0 0; font-size: 1.6rem; font-weight: 600; color: #ffffffa8; text-transform: capitalize; }
.off-msg { margin: 2.4rem 0 0; font-size: 1.1rem; color: var(--muted); }
.off-led { position: absolute; right: max(3rem, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: max(2.4rem, calc(env(safe-area-inset-bottom, 0px) + 16px)); width: .7rem; height: .7rem; border-radius: 50%; background: var(--led); box-shadow: 0 0 .9rem var(--led); }
.blink { position: fixed; inset: 0; z-index: 40; background: #000; opacity: 0; pointer-events: none; }
.blink.run { animation: blinkk .7s ease; }
@keyframes blinkk { 0% { opacity: 0; } 35%, 60% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- notifications & volume ---------- */
.toast {
  position: fixed; z-index: 60; top: max(5.4rem, calc(env(safe-area-inset-top, 0px) + 16px)); right: max(16px, env(safe-area-inset-right, 0px), 6rem);
  display: flex; align-items: center; gap: 1rem; box-sizing: border-box; max-width: min(34rem, calc(100% - 32px));
  padding: 1rem 1.4rem; border-radius: 1.2rem; background: #161b24f2; border: 1px solid var(--line); box-shadow: 0 1.4rem 3rem -1rem #000;
  font-size: 1.05rem; font-weight: 500; opacity: 0; transform: translateY(-.8rem); transition: opacity .3s ease, transform .35s var(--ease); pointer-events: none;
}
.toast.on { opacity: 1; transform: none; }
.toast-ic { flex: none; display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: .8rem; background: var(--glass-2); }

  function nearest(from, dir) {
    const a = from.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    let best = null, score = Infinity;
    for (const el of tiles) {
      if (el === from) continue;
      const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
      let main, cross;
      if (dir === 'right') { if (dx <= 4) continue; main = dx; cross = Math.abs(dy); }
      else if (dir === 'left') { if (dx >= -4) continue; main = -dx; cross = Math.abs(dy); }
      else if (dir === 'down') { if (dy <= 4) continue; main = dy; cross = Math.abs(dx); }
      else { if (dy >= -4) continue; main = -dy; cross = Math.abs(dx); }
      if ((dir === 'left' || dir === 'right') && cross > a.height * .6) continue;

    audioReady = true;
    if (!live) return;
    renderAll();
    listen();
  });
})();
</script>
