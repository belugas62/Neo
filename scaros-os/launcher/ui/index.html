<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scaros OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- fonts:local -->
<style>
@font-face { font-family: "Figtree"; src: url("fonts/figtree.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "Unbounded"; src: url("fonts/unbounded.woff2") format("woff2"); font-weight: 300 600; font-display: swap; }
</style>
<!-- /fonts:local -->
<style>
/* Layout: 10-foot home screen — a cinematic "shelf" for the focused app fills the top,
   a single row of label-less app icons sits under it; Réglages open full screen,
   the control center slides in from the right. */
:root {
  --ink: #05070b;
  --ink-2: #0d1118;
  --glass: #ffffff12;
  --glass-2: #ffffff1f;
  --line: #ffffff1c;
  --text: #f3f5f9;
  --text-2: #c6cbd5;
  --muted: #8a91a0;
  --focus-bg: #f3f5f9;
  --focus-fg: #0b0d12;
  --focus-muted: #4c5260;
  --sheet: #161b24f2;          /* panneaux flottants : centre de contrôle, notifications, volume */
  --ring: #ffffffe0;           /* contour de l'icône choisie */
  --shadow: #000;
  --scrim: .62;
  --field: #00000055;
  --shade: #05070bcc;          /* voile à gauche du grand visuel, sous le texte */
  --led: #ff3b30;
  --pad-a: #6cc04a;
  --pad-b: #e5484d;
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-brand: "Unbounded", "Figtree", system-ui, sans-serif;
  --u: min(1vw, 1.7778vh);
  --fs: 1;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.3, 1.3, .45, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
html { font-size: var(--u); background: #000; }
html[data-text="large"] { --fs: 1.12; }
html[data-text="xlarge"] { --fs: 1.25; }
/* Apparence claire (Réglages › Affichage). data-look plutôt que data-theme : ce nom-là peut
   être posé par la page qui affiche la maquette. */
html[data-look="light"] {
  --ink: #eceef3;
  --ink-2: #f3f4f7;
  --glass: #0b0d120f;
  --glass-2: #0b0d121a;
  --line: #0b0d121f;
  --text: #0b0d12;
  --text-2: #353b47;
  --muted: #646b79;
  --focus-bg: #15181f;
  --focus-fg: #ffffff;
  --focus-muted: #b4bac6;
  --sheet: #fbfbfdf2;
  --ring: #15181fe6;
  --shadow: #1a1f2b66;
  --scrim: .3;
  --field: #ffffffc0;
  --shade: #eceef3d9;
  color-scheme: light;
}
html[data-look="light"] .scene {
  background:
    radial-gradient(60% 85% at 76% 38%, color-mix(in oklab, var(--a) 34%, transparent), transparent 70%),
    radial-gradient(55% 70% at 8% 108%, color-mix(in oklab, var(--a) 18%, transparent), transparent 72%),
    linear-gradient(180deg, color-mix(in oklab, var(--a) 12%, var(--ink)) 0%, var(--ink) 100%);
}
html[data-look="light"] .scene-art svg { filter: drop-shadow(0 2.4rem 3.4rem color-mix(in oklab, var(--a) 35%, transparent)); }
/* écran de veille, extinction et téléphone de démo restent sombres */
.off, .phone { --text: #f3f5f9; --text-2: #c6cbd5; --muted: #8a91a0; --line: #ffffff1c; --glass: #ffffff12; --glass-2: #ffffff1f; }
.phone { color: var(--text); }
body, .stage, .pane, .pane.side, .toast, .vol { transition: background-color .45s ease, color .45s ease; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--font); font-size: calc(1.65rem * var(--fs)); line-height: 1.4;
  overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.ic { display: block; width: 1.4rem; height: 1.4rem; flex: none; }

/* ---------- accueil (façon tvOS) ----------
   Un décor plein écran (paysage qui suit la météo et l'heure, ou les couleurs de l'appli),
   le nom de l'appli choisie en grand en haut à gauche, l'heure et la météo dans une pastille
   en haut à droite, et les applis dans un dock translucide. */
.tv { position: relative; height: 100%; overflow: hidden; background: #000; }
.stage { position: relative; height: 100%; background: var(--ink); transition: opacity .6s ease, filter .6s ease; }
.stage.off-anim { opacity: 0; filter: brightness(.3); }
/* sur le décor (une « photo »), le texte reste blanc, même en apparence claire */
.stage[data-bg="decor"] { --text: #ffffff; --text-2: #eef1f6; --muted: #dde2ea; --line: #ffffff2e; --glass: #ffffff1f; color: var(--text); }
.stage[data-bg="decor"] .status, .stage[data-bg="decor"] .shelf-info, .stage[data-bg="decor"] .foot { text-shadow: 0 .15rem 1.4rem #00000059; }

/* décor : ciel, soleil ou lune, montagnes, lac, prairie */
.decor { position: absolute; inset: 0; display: none; overflow: hidden;
  --sky-a: #2c6cc0; --sky-b: #a7d0f2; --far: #8fa9c6; --mid: #5b7896; --near: #2d4a3e; --lake: #79acdf; --tree: #1f362d; --cap: .85;
  --orb: #fff6d8; --orb-glow: #ffd77a99; --orb-x: 74%; --orb-y: 24%; --orb-size: 7rem; }
.stage[data-bg="decor"] .decor { display: block; }
.decor-sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 68%); transition: opacity 1s ease; }
.decor-orb { position: absolute; left: var(--orb-x); top: var(--orb-y); width: var(--orb-size); height: var(--orb-size); border-radius: 50%;
  transform: translate(-50%, -50%); background: radial-gradient(circle at 42% 38%, #ffffff 0 18%, var(--orb) 62%); box-shadow: 0 0 4rem 1.4rem var(--orb-glow), 0 0 14rem 6rem color-mix(in oklab, var(--orb-glow) 45%, transparent);
  transition: top 1.2s var(--ease), background 1s ease, opacity 1s ease; }
.decor[data-orb="none"] .decor-orb { opacity: 0; }
.decor[data-orb="moon"] .decor-orb { --orb-size: 5rem;
  background: radial-gradient(circle at 62% 64%, #00000014 0 9%, transparent 10%), radial-gradient(circle at 38% 42%, #0000000f 0 13%, transparent 14%),
    radial-gradient(circle at 40% 36%, #ffffff, var(--orb) 70%); }
.decor-land { position: absolute; inset: 0; width: 100%; height: 100%; }
.decor-land path, .decor-land rect { transition: fill 1.2s ease, opacity 1.2s ease; }

/* mode « Couleurs des applis » : dégradé de l'appli choisie et son logo en grand */
.shelf { position: absolute; inset: 0; overflow: hidden; display: none; }
.stage[data-bg="apps"] .shelf { display: block; }
.scene {
  position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease;
  background:
    radial-gradient(60% 75% at 76% 30%, color-mix(in oklab, var(--a) 46%, transparent), transparent 70%),
    radial-gradient(55% 60% at 8% 100%, color-mix(in oklab, var(--b) 70%, transparent), transparent 72%),
    linear-gradient(180deg, color-mix(in oklab, var(--b) 35%, var(--ink)) 0%, var(--ink) 100%);
}
.scene.on { opacity: 1; }
.scene-art { position: absolute; right: 9rem; top: 8.5rem; width: 24rem; height: 17rem; display: grid; place-items: center; }
.scene-art svg { width: 100%; height: 100%; filter: drop-shadow(0 2.4rem 4rem color-mix(in oklab, var(--a) 50%, transparent)); }
.scene.on .scene-art { animation: float 9s ease-in-out infinite alternate; }
@keyframes float { from { transform: translateY(-.6rem) rotate(-1.5deg); } to { transform: translateY(.6rem) rotate(1.5deg); } }

/* voiles discrets : texte lisible en haut à gauche, dock posé sur le décor */
.home-scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(70% 55% at 0% 0%, #00000052, transparent 70%), linear-gradient(180deg, transparent 62%, #00000047 100%); }
.stage[data-bright] .status, .stage[data-bright] .shelf-info, .stage[data-bright] .foot { text-shadow: 0 .1rem 1rem #00000085, 0 0 .3rem #00000040; }
.stage[data-bright] .home-scrim { background: radial-gradient(75% 62% at 0% 0%, #0000007a, transparent 72%), radial-gradient(40% 30% at 100% 0%, #00000047, transparent 75%), linear-gradient(180deg, transparent 55%, #00000066 100%); }
.stage[data-bg="apps"] .home-scrim { background: linear-gradient(90deg, var(--shade) 0%, transparent 55%); }

.status {
  position: absolute; top: 2.6rem; left: 0; right: 0; z-index: 2;
  display: flex; align-items: flex-start; justify-content: space-between;
  padding-left: max(16px, env(safe-area-inset-left, 0px), 6rem);
  padding-right: max(16px, env(safe-area-inset-right, 0px), 5rem);
}
.brand { display: flex; align-items: center; gap: .9rem; margin-top: .5rem; opacity: .92; }
.brand .mark { width: 3rem; height: 3rem; }
.brand-word { font-family: var(--font-brand); font-weight: 500; font-size: calc(1.8rem * var(--fs)); letter-spacing: -.01em; }
.status-right { display: flex; flex-direction: column; align-items: flex-end; gap: .7rem; }
/* la pastille en haut à droite : heure, météo, appareils connectés */
.capsule { display: flex; align-items: center; gap: 1.3rem; padding: .75rem 1.6rem; border-radius: 99px;
  background: #10131a5c; border: 1px solid #ffffff24; color: #fff; text-shadow: none; }
html[data-look="light"] .stage[data-bg="apps"] .capsule { background: #ffffffa8; border-color: #0b0d121a; color: var(--text); }
.st { display: grid; place-items: center; transition: opacity .3s; }
.st .ic { width: 1.9rem; height: 1.9rem; }
.st.dim { opacity: .45; }
.clock { font-size: calc(2.2rem * var(--fs)); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.cap-sep { width: 1px; height: 2rem; background: currentColor; opacity: .25; }
.capsule:not(.has-icons) .cap-sep { display: none; }
.cap-icons { display: flex; align-items: center; gap: 1.1rem; }
.cap-icons:empty { display: none; }
.wx-cap { margin: 0; padding: .35rem 1.1rem; border-radius: 99px; background: #10131a40; font-size: calc(1.4rem * var(--fs)); font-weight: 600; color: #eef1f6; text-shadow: none; }
.wx-cap:empty { display: none; }
html[data-look="light"] .stage[data-bg="apps"] .wx-cap { background: #ffffff8c; color: var(--text-2); }

.shelf-info {
  position: absolute; z-index: 2; top: 9.4rem; max-width: 58rem;
  left: max(16px, env(safe-area-inset-left, 0px), 6rem);
}
.shelf-info.in { animation: infoIn .5s var(--ease); }
@keyframes infoIn { from { opacity: 0; transform: translateY(.6rem); } }
.kicker { margin: 0; font-size: calc(1.4rem * var(--fs)); font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--text-2); }
.shelf-title { margin: .4rem 0 0; font-size: calc(6.2rem * var(--fs)); font-weight: 800; line-height: 1; letter-spacing: -.045em; }
.shelf-desc { margin: 1.1rem 0 0; max-width: 46rem; font-size: calc(2rem * var(--fs)); font-weight: 500; line-height: 1.35; color: var(--text-2); text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.3rem 0 0; padding: 0; list-style: none; }
.chips li { padding: .45rem 1.1rem; font-size: calc(1.35rem * var(--fs)); font-weight: 600; color: var(--text-2); background: var(--glass); border: 1px solid var(--line); border-radius: 99px; text-shadow: none; }
.chips li.warn { color: #0b0d12; background: #f3f5f9; border-color: transparent; }

/* dock : une barre translucide, comme sur l'Apple TV */
.dock {
  position: absolute; z-index: 2; top: 32.4rem; left: 0; right: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px), 4rem);
  padding-right: max(16px, env(safe-area-inset-right, 0px), 4rem);
}
.dock-glass { padding: 1.9rem 2.1rem; border-radius: 3.2rem; background: #12151c61; border: 1px solid #ffffff1f; box-shadow: 0 2rem 4rem -2rem #0000008c; }
html[data-look="light"] .dock-glass { background: #ffffff47; border-color: #ffffff80; }
.stage[data-bg="apps"] .dock-glass { background: var(--glass); border-color: var(--line); box-shadow: none; }
.icons { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 2rem; perspective: 60rem; }
.icon { position: relative; min-width: 0; padding: 0; margin: 0; border: 0; background: none; cursor: pointer; }
.icon:focus { outline: none; }
.icon-art {
  position: relative; display: grid; place-items: center; overflow: hidden;
  aspect-ratio: 5 / 3; border-radius: 1.3rem; background: var(--bg);
  box-shadow: 0 .8rem 1.6rem -1rem #00000099, inset 0 0 0 1px #ffffff14;
  transition: transform .35s var(--spring), box-shadow .35s ease;
}
.icon-art svg { width: 46%; height: 52%; }
.icon[data-id="youtube"] .icon-art svg { width: 40%; }
.icon[data-id="twitch"] .icon-art svg { width: 40%; height: 48%; }
.icon-art::after {
  content: ""; position: absolute; inset: -40%; pointer-events: none;
  background: linear-gradient(120deg, transparent 40%, #ffffff40 50%, transparent 60%);
  transform: translateX(-60%); opacity: 0;
}
/* icône choisie : elle grandit et se soulève, sans cadre (comme tvOS) */
.icon-art::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s ease;
  background: linear-gradient(180deg, #ffffff2e, transparent 55%); box-shadow: inset 0 0 0 .12rem #ffffff70; }
.icon.is-focus .icon-art::before { opacity: 1; }
.icon.is-focus .icon-art {
  transform: translateY(-.9rem) scale(1.16);
  box-shadow: 0 2.6rem 3.2rem -1.2rem #000000c0, 0 2.2rem 5rem -1.6rem color-mix(in oklab, var(--glow, #fff) 55%, transparent);
  animation: tilt 5s ease-in-out .4s infinite alternate;
}
.icon.is-focus .icon-art::after { animation: shine 1.1s ease .1s 1; }
@keyframes tilt {
  0% { transform: translateY(-.9rem) scale(1.16) rotateX(2deg) rotateY(-3deg); }
  100% { transform: translateY(-.9rem) scale(1.16) rotateX(-2deg) rotateY(3deg); }
}
@keyframes shine { 0% { opacity: 1; transform: translateX(-60%); } 100% { opacity: 1; transform: translateX(60%); } }
.icon.bump .icon-art { animation: bump .32s ease; }
@keyframes bump { 40% { transform: translateY(-.9rem) scale(1.16) translateX(var(--bx, 0)); } }
.icon-name { display: none; }
.badge { position: absolute; right: .7rem; top: .7rem; z-index: 1; padding: .2rem .55rem; font-size: calc(.95rem * var(--fs)); font-weight: 700; color: #0b0d12; background: #f3f5f9; border-radius: .35rem; }

.foot {
  position: absolute; bottom: 2.2rem; left: 0; right: 0; z-index: 2;
  display: flex; justify-content: center; font-size: calc(1.4rem * var(--fs)); color: var(--muted);
}
.ver { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.hint-list { display: flex; gap: 2.2rem; opacity: .85; }
.hint { display: flex; align-items: center; gap: .55rem; }
.bg { display: inline-grid; place-items: center; min-width: 2.3rem; height: 2.3rem; padding: 0 .1rem; box-sizing: border-box; border-radius: 99px; font-size: calc(1.2rem * var(--fs)); font-weight: 700; color: #0b0d12; text-shadow: none; }
.bg .ic { width: 1.45rem; height: 1.45rem; }
.g-a { background: var(--pad-a); }
.g-b { background: var(--pad-b); }
.g-menu { background: var(--text); color: var(--ink); }
.stage[data-bg="decor"] .g-menu { color: #0b0d12; }
.g-num { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 0 .5rem; border-radius: .4rem; font-variant-numeric: tabular-nums; }

.stage.enter .decor, .stage.enter .shelf { animation: fadeIn .9s ease both; }
.stage.enter .status { animation: rise .8s var(--ease) .1s both; }
.stage.enter .shelf-info { animation: rise .8s var(--ease) .18s both; }
.stage.enter .dock { animation: rise .8s var(--ease) .26s both; }
.stage.enter .foot { animation: fadeIn .8s ease .4s both; }
@keyframes rise { from { opacity: 0; transform: translateY(1.6rem); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- météo animée sur le décor : nuages, pluie, neige, étoiles, aurore ----------
   Uniquement des déplacements et des fondus de calques déjà dessinés : la carte graphique
   s'en charge, le processeur reste libre. Tout s'arrête quand une appli est ouverte. */
.sky {
  position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none;
  --drop: #ffffff80; --flake: #ffffffee; --star: #ffffff; --cloud: 255, 255, 255; --cloud-o: .5;
  opacity: 0; transition: opacity 1.2s ease;
}
.sky.on { opacity: 1; }
.sky > * { position: absolute; display: none; }
.sky[data-sky~="rays"] .sky-sun, .sky[data-sky~="stars"] .sky-stars,
.sky[data-sky~="aurora"] .sky-aurora, .sky[data-sky~="clouds"] .sky-clouds, .sky[data-sky~="fog"] .sky-fog,
.sky[data-sky~="rain"] .sky-rain, .sky[data-sky~="snow"] .sky-snow, .sky[data-sky~="flash"] .sky-flash { display: block; }

/* rayons qui tournent lentement autour du soleil du décor */
.sky-sun { left: var(--orb-x, 74%); top: var(--orb-y, 24%); width: 44rem; height: 44rem; transform: translate(-50%, -50%); }
.sky-sun::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-conic-gradient(#fff3c81f 0 5deg, transparent 5deg 15deg);
  -webkit-mask-image: radial-gradient(closest-side, #000 22%, transparent); mask-image: radial-gradient(closest-side, #000 22%, transparent);
  animation: spin 160s linear infinite; }

.sky-stars { inset: 0 0 42%; background-size: 31rem 23rem; animation: twinkle 3.6s ease-in-out infinite alternate;
  background-image:
    radial-gradient(.13rem .13rem at 3rem 4rem, var(--star) 50%, transparent), radial-gradient(.1rem .1rem at 11rem 15rem, var(--star) 50%, transparent),
    radial-gradient(.16rem .16rem at 19rem 7rem, var(--star) 50%, transparent), radial-gradient(.1rem .1rem at 26rem 18rem, var(--star) 50%, transparent),
    radial-gradient(.12rem .12rem at 7rem 20rem, var(--star) 50%, transparent), radial-gradient(.09rem .09rem at 23rem 2rem, var(--star) 50%, transparent),
    radial-gradient(.11rem .11rem at 15rem 11rem, var(--star) 50%, transparent), radial-gradient(.14rem .14rem at 29rem 12rem, var(--star) 50%, transparent);
  -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent); mask-image: linear-gradient(180deg, #000 55%, transparent); }
.sky-stars + .sky-stars { background-size: 23rem 17rem; background-position: 7rem 5rem; animation-duration: 5.2s; animation-direction: alternate-reverse; opacity: .7; }
@keyframes twinkle { from { opacity: .35; } to { opacity: .95; } }

.sky-aurora { inset: -10% -10% 45%; }
.sky-aurora i { position: absolute; width: 70rem; height: 22rem; border-radius: 50%; opacity: .55; }
.sky-aurora i:nth-child(1) { left: 0; top: 7rem; background: radial-gradient(closest-side, #2ee59d80, transparent); animation: auroraA 22s ease-in-out infinite alternate; }
.sky-aurora i:nth-child(2) { left: 30%; top: 3rem; background: radial-gradient(closest-side, #3fb6ff66, transparent); animation: auroraB 27s ease-in-out infinite alternate; }
.sky-aurora i:nth-child(3) { left: 55%; top: 10rem; background: radial-gradient(closest-side, #a46bff5c, transparent); animation: auroraA 31s ease-in-out -9s infinite alternate-reverse; }
@keyframes auroraA { from { transform: translateX(-8rem) rotate(-8deg) scaleY(.8); } to { transform: translateX(10rem) rotate(6deg) scaleY(1.15); } }
@keyframes auroraB { from { transform: translateX(6rem) rotate(5deg); } to { transform: translateX(-9rem) rotate(-7deg) scaleY(1.2); } }

/* nuages : plusieurs boules douces qui forment un vrai nuage, et qui dérivent */
.sky-clouds { inset: 0 0 45%; }
.sky-clouds i { position: absolute; left: 0; width: 36rem; height: 12rem; animation: drift 150s linear infinite;
  background:
    radial-gradient(closest-side at 30% 62%, rgba(var(--cloud), var(--cloud-o)), transparent),
    radial-gradient(closest-side at 52% 44%, rgba(var(--cloud), var(--cloud-o)), transparent),
    radial-gradient(closest-side at 72% 64%, rgba(var(--cloud), var(--cloud-o)), transparent),
    radial-gradient(46% 25% at 50% 72%, rgba(var(--cloud), calc(var(--cloud-o) * .9)), transparent); }
.sky-clouds i:nth-child(1) { top: 3rem; animation-delay: -30s; }
.sky-clouds i:nth-child(2) { top: 10rem; width: 28rem; height: 9rem; animation-duration: 190s; animation-delay: -120s; }
.sky-clouds i:nth-child(3) { top: 0; width: 46rem; height: 15rem; animation-duration: 230s; animation-delay: -170s; }
.sky-clouds i:nth-child(4) { top: 15rem; width: 24rem; height: 8rem; animation-duration: 170s; animation-delay: -60s; }
.sky[data-sky~="dense"] .sky-clouds i { width: 60rem; height: 18rem; }
@keyframes drift { from { transform: translateX(-62rem); } to { transform: translateX(112rem); } }

.sky-fog { inset: 14rem 0 auto; height: 40rem; }
.sky-fog i { position: absolute; left: 0; width: 200%; height: 16rem;
  background: linear-gradient(90deg, transparent, #ffffff3d 20%, transparent 40%, #ffffff33 65%, transparent 85%);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent); mask-image: linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent);
  animation: fogMove 70s linear infinite; }
.sky-fog i + i { top: 14rem; animation-duration: 95s; animation-direction: reverse; opacity: .85; }
@keyframes fogMove { from { transform: translateX(-50%); } to { transform: translateX(0); } }

.sky-rain { inset: -30rem -12% 0; transform: rotate(9deg); }
.sky-rain::before { content: ""; position: absolute; inset: 0; background-size: 30rem 30rem; animation: fall .75s linear infinite;
  background-image:
    radial-gradient(.11rem 1.7rem at 2rem 3rem, var(--drop), transparent), radial-gradient(.11rem 1.7rem at 9rem 17rem, var(--drop), transparent),
    radial-gradient(.11rem 1.7rem at 15rem 8rem, var(--drop), transparent), radial-gradient(.11rem 1.7rem at 21rem 22rem, var(--drop), transparent),
    radial-gradient(.11rem 1.7rem at 27rem 13rem, var(--drop), transparent), radial-gradient(.11rem 1.7rem at 5rem 26rem, var(--drop), transparent),

.opts { display: flex; flex-direction: column; gap: .55rem; }

  display: flex; align-items: center; gap: 1.5rem; width: 100%; min-height: 5.8rem; box-sizing: border-box;

.card { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.6rem; padding: 1.3rem 1.5rem; border-radius: 1.1rem; background: var(--glass); border: 1px solid var(--line); }

/* ---------- ouverture d'une appli ---------- */

/* ---------- démarrage ---------- */

/* ---------- veille & extinction ---------- */

  background: radial-gradient(35% 40% at 30% 40%, #2b3f7a, transparent 70%), radial-gradient(30% 35% at 70% 65%, #5a2b6e, transparent 70%);
  animation: aurora 30s ease-in-out infinite alternate; }

/* ---------- notifications & volume ---------- */

    const a = from.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    let best = null, score = Infinity;
    for (const el of list) {
      if (el === from) continue;
      const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
      let main, cross;
      if (dir === 'right') { if (dx <= 4) continue; main = dx; cross = Math.abs(dy); }
      else if (dir === 'left') { if (dx >= -4) continue; main = -dx; cross = Math.abs(dy); }
      else if (dir === 'down') { if (dy <= 4) continue; main = dy; cross = Math.abs(dx); }
      else { if (dy >= -4) continue; main = -dy; cross = Math.abs(dx); }
      if ((dir === 'left' || dir === 'right') && cross > a.height * .6) continue;
      const s = main + cross * 2.2;
      if (s < score) { score = s; best = el; }

  let demoWx = 0;
  // Décor de l'accueil : un paysage dont le ciel, la lumière et les couleurs suivent la météo et l'heure.
  // Palettes : ciel (haut, bas), montagnes lointaines, collines, prairie, lac, sapins, neige sur les sommets.
  const PAL = {
    clear:  { a: '#2c6cc0', b: '#a7d0f2', far: '#8fa9c6', mid: '#5b7896', near: '#2d4a3e', lake: '#79acdf', tree: '#1f362d', cap: .85, cloud: '255,255,255', co: .55 },

  // moment de la journée : nuit d'après la météo (lever et coucher réels), aube et soir d'après l'heure
  function dayPhase(w) {
    const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
    const night = w ? !w.day : (h < 7 || h >= 20.5);
    if (night) return 'night';
    if (h < 8.5) return 'dawn';
    if (h >= 18) return 'dusk';
    return 'day';
  }
  // ce que montre le décor : temps qu'il fait (réel ou choisi), moment de la journée
  function skyScene() {
    const bg = state.prefs.bg || 'weather', w = state.weather;
    if (bg === 'none') return null;
    let kind = bg === 'weather' ? (w ? w.kind : 'clear') : { stars: 'clear', aurora: 'clear', rain: 'rain', snow: 'snow' }[bg];
    let phase = bg === 'stars' || bg === 'aurora' ? 'night' : dayPhase(bg === 'weather' ? w : null);
    const bright = kind === 'clear' || kind === 'partly';
    const pal = phase === 'night' ? (bright ? PAL.night : PAL.murk)
      : (phase === 'dawn' || phase === 'dusk') && bright ? PAL[phase]
      : PAL[kind === 'partly' ? 'clear' : kind] || PAL.cloudy;
    const orb = !bright ? 'none' : phase === 'night' ? 'moon' : 'sun';
    const layers = [];
    if (orb === 'sun' && phase === 'day' && kind === 'clear') layers.push('rays');
    if (phase === 'night' && bright) layers.push('stars');
    if (bg === 'aurora') layers.push('aurora');
    if (kind === 'partly') layers.push('clouds');
    if (kind === 'cloudy') layers.push('clouds', 'dense');
    if (kind === 'fog') layers.push('fog', 'clouds');
    if (kind === 'rain') layers.push('clouds', 'dense', 'rain');
    if (kind === 'storm') layers.push('clouds', 'dense', 'rain', 'heavy', 'flash');
    if (kind === 'snow') layers.push('clouds', 'snow');
    return { pal, orb, phase, kind, layers: layers.join(' ') };
  }
  let skyKey = '';
  function applySky() {
    const sc = skyScene(), stage = $('#stage'), sky = $('#sky'), decor = $('#decor');
    const key = sc ? `${sc.layers}|${sc.orb}|${sc.phase}|${sc.pal.a}` : 'apps';
    if (key === skyKey) return;
    skyKey = key;
    stage.dataset.bg = sc ? 'decor' : 'apps';
    if (sc && sc.phase !== 'night' && ['snow', 'fog', 'cloudy', 'clear', 'partly', 'rain'].includes(sc.kind)) stage.dataset.bright = '';
    else delete stage.dataset.bright;
    sky.classList.toggle('on', !!sc);
    if (!sc) { sky.dataset.sky = ''; return; }
    const p = sc.pal;
    const vars = { '--sky-a': p.a, '--sky-b': p.b, '--far': p.far, '--mid': p.mid, '--near': p.near, '--lake': p.lake, '--tree': p.tree, '--cap': p.cap,
      '--orb': sc.orb === 'moon' ? '#f1efe6' : sc.phase === 'day' ? '#fff6d8' : '#ffd2a3',
      '--orb-glow': sc.orb === 'moon' ? '#a9bcff55' : sc.phase === 'day' ? '#ffd77a99' : '#ff9d6a99',
      '--orb-y': sc.orb === 'sun' && sc.phase !== 'day' ? '46%' : '24%' };
    for (const [k, v] of Object.entries(vars)) decor.style.setProperty(k, v);
    decor.dataset.orb = sc.orb;
    sky.style.setProperty('--orb-y', vars['--orb-y']);
    sky.style.setProperty('--cloud', p.cloud);
    sky.style.setProperty('--cloud-o', p.co);
    sky.dataset.sky = sc.layers;
  }

    if (state.panel) closePanel({ resume: false });
    const r = $('#t-' + id + ' .icon-art').getBoundingClientRect();
    L.style.setProperty('--t', `${r.top}px`);
    L.style.setProperty('--l', `${r.left}px`);
    L.style.setProperty('--r', `${innerWidth - r.right}px`);
    L.style.setProperty('--b', `${innerHeight - r.bottom}px`);
    L.style.setProperty('--lbg', t.bg);
    L.style.setProperty('--lfg', t.fg || '#fff');
    $('#l-logo').innerHTML = ART[id]();
    $('#l-status').textContent = `Ouverture de ${t.name}…`;
    $('#l-note').textContent = ''; $('#l-fine').textContent = '';
    L.classList.remove('ready', 'slow');
    state.launched = id;
    if (instant) L.style.transition = 'none';
    L.hidden = false; void L.offsetWidth; L.classList.add('on');
    if (instant) { void L.offsetWidth; L.style.transition = ''; }
    clearTimeout(launchTimer); clearTimeout(slowTimer);
    // un premier lancement peut être long sur ce petit PC : on le dit plutôt que de laisser croire à une panne
    slowTimer = setTimeout(() => {
      if (state.launched !== id || L.classList.contains('ready')) return;
      $('#l-note').textContent = `${t.name} met un peu de temps à s’ouvrir. La première fois, ça peut prendre jusqu’à une minute.`;
      $('#l-fine').textContent = 'B pour revenir au menu';
      L.classList.add('slow');
    }, state.live ? 12000 : 60000);
    if (!state.live) {
      launchTimer = setTimeout(() => {
        $('#l-status').textContent = `${t.name} est ouvert`;
        $('#l-note').textContent = `Sur le PC, ${t.name} s’affiche ici en plein écran, en interface TV.`;
        $('#l-fine').textContent = 'Maquette : aucune appli n’est vraiment lancée. ≡ ouvre le centre de contrôle par-dessus.';
        L.classList.add('ready');
        if (!state.panel) $('#l-back').focus({ preventScroll: true });
      }, reduce ? 0 : 1400);
    }
  }
  function closeLaunch(notify = true) {
    clearTimeout(launchTimer); clearTimeout(slowTimer); clearTimeout(awayTimer);
    const was = state.launched;
    state.launched = null;
    $('#tv').classList.remove('away');
    if (state.live && notify && was) api('/api/close', {}).catch(() => {});
    L.classList.remove('on');
    setTimeout(() => { if (!state.launched) L.hidden = true; }, 600);
    setFocus(state.focus);
  }
  function goHome() {
    if (state.power === 'sleep') { wake(); return; }
    if (state.panel) closePanel({ resume: false });
    if (state.launched) closeLaunch(false);
    setFocus(state.focus);
  }
  function channel(a) {
    const t = APPS.find(x => 'ch' + x.ch === a);
    if (!t) return;
    setFocus(t.id, !state.launched);
    launch(t.id);
  }

  // ---------- démarrage, veille, extinction ----------
  let bootTimer, firstBoot = true;
  function boot() {
    state.booting = true;
    B.hidden = false; B.classList.remove('run', 'out'); void B.offsetWidth; B.classList.add('run');
    clearTimeout(bootTimer);
    bootTimer = setTimeout(endBoot, reduce ? 0 : 3000);
  }
  function endBoot() {
    if (!state.booting) return;
    state.booting = false; clearTimeout(bootTimer);
    B.classList.add('out');
    stage.classList.remove('enter', 'off-anim'); void stage.offsetWidth; stage.classList.add('enter');
    setTimeout(() => { if (!state.booting) B.hidden = true; }, 750);
    setFocus(state.focus);
    if (firstBoot) {
      firstBoot = false;
      const touch = matchMedia('(pointer: coarse)').matches;
      setTimeout(() => {
        if (state.pad) return;
        if (state.live) toast('gamepad', 'Allume ta manette Xbox. Le clavier marche aussi : flèches, Entrée, Échap.', 6000);
        else toast(touch ? 'phone' : 'gamepad', touch
          ? 'Touche une icône pour l’ouvrir. Sur le PC, tout se fait à la manette.'
          : 'Flèches et Entrée pour naviguer, Échap pour revenir, M pour le centre de contrôle.', 6000);
      }, 1000);
    }
  }
  function showOff(kind, msg) {
    OFF.dataset.kind = kind;
    $('#off-msg').textContent = msg;
    OFF.classList.toggle('fade', kind === 'sleep');
    OFF.hidden = false;
  }
  function powerOff(restart) {
    state.power = 'busy';
    stage.classList.add('off-anim');
    if (state.live) api('/api/power', { action: restart ? 'restart' : 'off' }).catch(() => {});
    setTimeout(() => {
      if (state.live) showOff('off', restart ? 'Redémarrage…' : 'Extinction…');
      else if (restart) { state.power = null; boot(); }
      else { state.power = 'off'; showOff('off', 'Scaros est éteint. Appuie sur une touche pour rallumer.'); }
    }, reduce ? 30 : 700);
  }
  function sleep() { state.power = 'sleep'; showOff('sleep', 'Appuie sur une touche pour revenir.'); }
  function wake() {
    const was = state.power;
    state.power = null; OFF.hidden = true;
    if (was === 'off') boot(); else setFocus(state.focus);
  }

  // ---------- notifications & volume ----------
  let toastTimer, volTimer;
  function toast(ic, text, ms = 3600) {
    T.querySelector('.toast-ic').innerHTML = icon(ic);
    T.querySelector('.toast-text').textContent = text;
    T.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => T.classList.remove('on'), ms);
  }
  function showVol() {
    const level = state.volume ?? 0;
    V.style.setProperty('--v', state.muted ? 0 : level / 100);
    V.classList.toggle('muted', state.muted);
    $('#vol-ic').innerHTML = icon(state.muted ? 'mute' : 'speaker');
    $('#vol-num').textContent = state.muted ? 'Muet' : level;
    V.classList.add('on');
    clearTimeout(volTimer);
    volTimer = setTimeout(() => V.classList.remove('on'), 1600);
  }
  function vol(d) {
    if (state.live) { api('/api/input', { action: d > 0 ? 'volup' : 'voldown' }).catch(() => {}); return; }
    state.volume = Math.max(0, Math.min(100, state.volume + d));
    state.muted = false;
    showVol(); renderStatus();
    if (state.panel === 'sound' || state.panel === 'control') rerenderPane();
  }
  function mute() {
    if (state.live) { api('/api/input', { action: 'mute' }).catch(() => {}); return; }
    state.muted = !state.muted;
    showVol(); renderStatus();
    if (state.panel === 'sound' || state.panel === 'control') rerenderPane();
  }

  // ---------- télécommande de démo (maquette) ----------
  function showPhone(on) {
    state.phoneDemo = on; P.hidden = !on; renderStatus();
    if (on) toast('phone', 'Téléphone connecté. Essaie les flèches de la télécommande.');
  }
  P.addEventListener('click', e => {
    const b = e.target.closest('[data-pact]');
    if (!b) return;
    const a = b.dataset.pact;
    if (a === 'close') { showPhone(false); return; }
    b.classList.remove('press'); void b.offsetWidth; b.classList.add('press');
    act(a);
  });
  $('#psearch').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#pinput').value.trim();
    if (!v) return;
    toast('send', `Envoyé à l’écran : « ${v} »`);
    $('#pinput').value = '';
  });

  // ---------- une seule entrée pour toutes les commandes ----------
  function act(a) {
    poke();
    if (state.booting) { endBoot(); return; }
    if (state.power === 'busy') return;
    if (state.power) { if (!(state.live && state.power === 'off')) wake(); return; }
    if (a === 'volup') return vol(5);
    if (a === 'voldown') return vol(-5);
    if (a === 'mute') return mute();
    if (a === 'menu') return toggleControl();
    if (a === 'qr') { if (state.panel !== 'remote') { closePanel({ resume: false }); openPanel('remote'); } return; }
    if (state.panel) {
      if (a === 'home') { closePanel({ resume: false }); if (state.launched) closeLaunch(); return; }
      const cur = state.pItems[state.pIdx];
      if ((a === 'left' || a === 'right') && cur && cur.dataset.adjust === 'vol') vol(a === 'left' ? -5 : 5);
      else if (a === 'up' || a === 'down' || a === 'left' || a === 'right') {
        const next = cur && nearest(cur, a, state.pItems);
        if (next) setPIdx(state.pItems.indexOf(next));
        else if (a === 'up' && state.pIdx > 0) setPIdx(state.pIdx - 1);
        else if (a === 'down' && state.pIdx < state.pItems.length - 1) setPIdx(state.pIdx + 1);
      }
      else if (a === 'ok') { const el = state.pItems[state.pIdx]; if (el) activate(el.dataset.act); }
      else if (a === 'back') backPanel();
      else if (a.startsWith('ch')) { closePanel({ resume: false }); channel(a); }
      return;
    }
    if (mirroring()) {
      if (a === 'back' || a === 'home') stopAirplay();
      return;
    }
    if (state.launched) {
      if (a === 'back' || a === 'home') closeLaunch();
      else if (a.startsWith('ch')) channel(a);
      return;
    }
    if (a === 'up' || a === 'down' || a === 'left' || a === 'right') move(a);
    else if (a === 'ok') launch(state.focus);
    else if (a === 'home') setFocus('youtube');
    else if (a.startsWith('ch')) channel(a);
  }

  function poke() {
    lastInputAt = Date.now();
    $('#tv').classList.remove('idle');
  }
  setInterval(() => { if (Date.now() - lastInputAt > 45000) $('#tv').classList.add('idle'); }, 5000);

  // clavier (sur le PC, la manette et le téléphone arrivent aussi ici sous forme de touches)
  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok',
    Escape: 'back', Backspace: 'back', Home: 'home', '+': 'volup', '=': 'volup', '-': 'voldown',
    m: 'menu', M: 'menu', ContextMenu: 'menu', F1: 'menu', q: 'qr', Q: 'qr',
    '1': 'ch1', '2': 'ch2', '3': 'ch3', '4': 'ch4', '5': 'ch5', '0': 'mute' };
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (KBT[state.panel] && (e.key.length === 1 || e.key === 'Backspace')) {
      e.preventDefault();
      poke();
      if (e.key === 'Backspace') eraseChar(); else typeChar(e.key);
      // après une frappe au clavier ou au téléphone, Entrée valide directement
      const okKey = state.pItems.find(el => el.classList.contains('go'));
      renderPanel(okKey ? okKey.dataset.act : currentAct());
      return;
    }
    if ((e.key === 'h' || e.key === 'H') && !state.booting && !state.power) {
      toggleHdmi();
      if (state.panel === 'display' && !state.live) renderPanel(currentAct());
      return;
    }
    const a = KEYS[e.key];
    if (!a) { if (state.booting) endBoot(); else if (state.power && state.power !== 'busy') act('ok'); return; }
    // Entrée sur un vrai bouton (téléphone de démo, « retour ») garde son clic normal
    if (a === 'ok' && e.target.closest && e.target.closest('.pbtn, .l-back, .phone-x, .dpad button')) return;
    e.preventDefault();
    act(a);
  });

  // souris & tactile
  tiles.forEach(el => {
    el.addEventListener('click', () => {
      if (state.booting || state.power) return act('ok');
      setFocus(el.dataset.id); launch(el.dataset.id);
    });
    el.addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse' && state.focus !== el.dataset.id && !state.panel && !state.launched) setFocus(el.dataset.id);
    });
    el.addEventListener('focus', () => { if (state.focus !== el.dataset.id) setFocus(el.dataset.id, false); });
  });
  addEventListener('pointerdown', poke, { passive: true });
  addEventListener('pointermove', () => { if ($('#tv').classList.contains('idle')) poke(); }, { passive: true });
  pane.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const i = state.pItems.indexOf(el);
    if (i >= 0) setPIdx(i);
    activate(el.dataset.act);
  });
  pane.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const el = e.target.closest('[data-act]');
    const i = el ? state.pItems.indexOf(el) : -1;
    if (i >= 0 && i !== state.pIdx) setPIdx(i);
  });
  pane.addEventListener('focusin', e => {
    const i = state.pItems.indexOf(e.target);
    if (i >= 0 && i !== state.pIdx) setPIdx(i);
  });
  scrim.addEventListener('click', closePanel);
  $('#l-back').addEventListener('click', () => closeLaunch());
  B.addEventListener('click', endBoot);
  OFF.addEventListener('click', () => act('ok'));

  // manette lue par le navigateur : pour la maquette, et sur le PC seulement si scaros.py ne peut pas la lire
  const held = {};
  let polling = false;
  const browserPad = () => !(state.live && state.padSupport);
  function pads() { try { return navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; } catch (e) { return []; } }
  function repeat(k, on, now) {
    const h = held[k] || (held[k] = { on: false, next: 0 });
    if (on && !h.on) { act(k); h.next = now + 380; }
    else if (on && now >= h.next) { act(k); h.next = now + 120; }
    h.on = on;
  }
  function edge(k, on, a) {
    const h = held[k] || (held[k] = { on: false });
    if (on && !h.on) act(a);
    h.on = on;
  }
  function padLoop() {
    const gp = browserPad() ? pads()[0] : null;
    if (gp) {
      const now = performance.now(), b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
      const x = gp.axes[0] || 0, y = gp.axes[1] || 0;
      repeat('up', b(12) || y < -.55, now);
      repeat('down', b(13) || y > .55, now);
      repeat('left', b(14) || x < -.55, now);
      repeat('right', b(15) || x > .55, now);
      edge('a', b(0), 'ok'); edge('b', b(1), 'back'); edge('guide', b(16), 'home'); edge('start', b(9), 'menu');
      edge('lb', b(4), 'voldown'); edge('rb', b(5), 'volup');
    }
    if (polling) requestAnimationFrame(padLoop);
  }
  addEventListener('gamepadconnected', e => {
    if (!browserPad()) return;
    state.pad = e.gamepad.id; renderStatus();
    toast('gamepad', /xbox|xinput|045e/i.test(e.gamepad.id) ? 'Manette Xbox connectée.' : 'Manette connectée.');
    if (!polling) { polling = true; padLoop(); }
  });
  addEventListener('gamepaddisconnected', () => {
    if (!browserPad()) return;
    const left = pads();
    state.pad = left.length ? left[0].id : null;
    if (!left.length) polling = false;
    renderStatus(); toast('gamepad', 'Manette déconnectée.');
  });

  // horloge
  const fT = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const fD = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  function tick() {
    const d = new Date();
    $('#clock').textContent = fT.format(d);
    $('#sleep-clock').textContent = fT.format(d);
    $('#sleep-date').textContent = fD.format(d);
    const cc = pane.querySelector('.cc-time');
    if (cc) cc.textContent = fT.format(d);
    if (state.prefs.theme === 'auto') applyPrefs();  // bascule clair/sombre à 7 h et 19 h
    applySky();  // aube, journée, soir : le décor suit l'heure
  }
  tick(); setInterval(tick, 10000);

  // démarrage
  applyOutput(true);
  updateHints();
  renderStatus();
  setFocus('youtube', false);
  renderShelf();
  boot();
  connect().then(live => {
    audioReady = true;
    if (!live) return;
    renderAll();
    listen();
    syncApp(firstState);
  });
})();
</script>
