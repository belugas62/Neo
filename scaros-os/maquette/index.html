<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scaros OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@300;500;600&display=swap">
<style>
/* Layout: 10-foot TV launcher — status bar, hero for the focused channel, two rails of tiles.
   The room glows in the colour of the focused app (ambilight); the chrome stays quiet. */
:root {
  --ink: #06080c;          /* screen black, blue-biased */
  --ink-raised: #0f131b;   /* sheets, toasts, phone */
  --line: #dfe6ff1c;
  --text: #eef1f6;
  --text-2: #c9cfdb;
  --muted: #8a92a4;
  --led: #ff3b30;          /* standby LED */
  --focus: #ffffff;
  --pad-a: #6cc04a;        /* controller A */
  --pad-b: #e5484d;        /* controller B */
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --u: min(1vw, 1.7778vh);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
html { font-size: var(--u); background: #000; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--font-body); font-size: 1.15rem; line-height: 1.45;
  overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.ic { display: block; width: 1.4rem; height: 1.4rem; flex: none; }

/* ---------- stage ---------- */
.tv { position: relative; height: 100%; overflow: hidden; background: #000; }
.crt { position: relative; height: 100%; transform-origin: 50% 50%; }
.crt.crt-off { animation: crtOff .78s cubic-bezier(.55, 0, .8, .4) forwards; }
@keyframes crtOff {
  0%   { transform: none; filter: brightness(1); }
  45%  { transform: scale(1, .006); filter: brightness(3); }
  78%  { transform: scale(.004, .006); filter: brightness(4); opacity: 1; }
  100% { transform: scale(0, 0); opacity: 0; }
}

.ambient { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(140% 100% at 50% 115%, #111827 0%, var(--ink) 62%); }
.amb-drift { position: absolute; inset: -15%; animation: drift 26s ease-in-out infinite alternate; }
.amb {
  position: absolute; inset: 0; opacity: 0; transition: opacity 1.1s ease;
  background:
    radial-gradient(40% 46% at 26% 30%, color-mix(in oklab, var(--c1) 72%, transparent), transparent 72%),
    radial-gradient(42% 44% at 84% 94%, color-mix(in oklab, var(--c2) 88%, transparent), transparent 70%);
}
.amb.on { opacity: .44; }
.scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, #ffffff06 0 1px, transparent 1px 4px); }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 50% 42%, transparent 55%, #000000b0 100%); }
@keyframes drift { from { transform: translate3d(-2%, -1%, 0) scale(1); } to { transform: translate3d(2%, 2%, 0) scale(1.08); } }

.screen {
  position: relative; height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column;
  padding-block: 2.4rem 1.8rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px), 4.4rem);
  padding-right: max(16px, env(safe-area-inset-right, 0px), 4.4rem);
}

/* ---------- status bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 2rem; }
.brand { display: flex; align-items: center; gap: .9rem; }
.brand .mark { width: 2.3rem; height: auto; }
.brand-word { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; letter-spacing: .34em; }
.status { display: flex; align-items: center; gap: 1.5rem; color: var(--text-2); }
.pill { display: flex; align-items: center; gap: .6rem; padding: .4rem 1rem .4rem .8rem; border: 1px solid var(--line); border-radius: 99px; font-size: .95rem; font-weight: 600; background: #ffffff08; }
.pill .ic { width: 1.25rem; height: 1.25rem; }
.st { display: grid; place-items: center; transition: opacity .3s; }
.st.dim { opacity: .35; }
.clock-wrap { display: flex; align-items: baseline; gap: .7rem; padding-left: .4rem; }
.clock { font-size: 1.7rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.date { font-size: .95rem; color: var(--muted); }

/* ---------- home ---------- */
.home { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 3.2rem; }
.hero { max-width: 64rem; }
.hero-inner.in { animation: heroIn .45s var(--ease); }
@keyframes heroIn { from { opacity: 0; transform: translateY(.7rem); } to { opacity: 1; transform: none; } }
.eyebrow { display: flex; align-items: center; gap: .7rem; margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; letter-spacing: .06em; color: var(--text); padding: .1rem .5rem; border: 1px solid var(--line); border-radius: .4rem; }
.hero-title { margin: .9rem 0 1.1rem; font-family: var(--font-display); font-weight: 500; font-size: 4.6rem; line-height: 1; letter-spacing: -.015em; text-wrap: balance; }
.hero-desc { margin: 0; max-width: 46rem; font-size: 1.4rem; color: var(--text-2); text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: .7rem; margin: 1.5rem 0 0; padding: 0; list-style: none; }
.chips li { padding: .38rem .9rem; font-size: .95rem; font-weight: 500; border: 1px solid var(--line); border-radius: 99px; background: #ffffff0d; }

.rows { display: flex; flex-direction: column; gap: 2.2rem; }
.row-label { margin: 0 0 1.1rem; font-size: .95rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.tiles { display: flex; gap: 1.6rem; }

.tile {
  position: relative; flex: 0 0 auto; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  width: 19rem; aspect-ratio: 16 / 9; padding: 1.3rem 1.4rem; margin: 0;
  border: 0; border-radius: 1.2rem; overflow: hidden; cursor: pointer; text-align: left;
  background: linear-gradient(150deg, color-mix(in oklab, var(--c1) 48%, var(--ink)) 0%, color-mix(in oklab, var(--c2) 58%, var(--ink)) 100%);
  box-shadow: inset 0 0 0 1px #ffffff14;
  transition: transform .3s var(--ease), box-shadow .3s ease;
}
.tile::after { content: ""; position: absolute; inset: 0; z-index: 3; background: var(--ink); opacity: .4; transition: opacity .3s ease; pointer-events: none; }
.tile::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; z-index: 4; pointer-events: none; background: linear-gradient(100deg, transparent, #ffffff30, transparent); transform: translateX(-130%); }
.tile:focus { outline: none; }
.tile.is-focus {
  z-index: 2; transform: scale(1.07);
  box-shadow: 0 0 0 .22rem var(--focus), 0 1.6rem 3.2rem -.8rem color-mix(in oklab, var(--c1) 70%, transparent);
}
.tile.is-focus::after { opacity: 0; }
.tile.is-focus::before { animation: sheen .9s ease .12s 1; }
@keyframes sheen { to { transform: translateX(260%); } }
.tile.bump { animation: bump .32s ease; }
@keyframes bump { 40% { transform: scale(1.07) translate(var(--bx, 0), var(--by, 0)); } }
.glyph, .name, .ch { position: relative; z-index: 2; }
.tile.app .glyph .ic { width: 2.8rem; height: 2.8rem; }
.name { font-size: 1.35rem; font-weight: 700; letter-spacing: .01em; }
.ch { position: absolute; top: 1.15rem; right: 1.25rem; font-size: .9rem; font-weight: 600; letter-spacing: .08em; font-variant-numeric: tabular-nums; opacity: .8; }
.wm { position: absolute; right: -1.8rem; bottom: -2.6rem; z-index: 1; opacity: .14; }
.wm .ic { width: 10rem; height: 10rem; }
.tile.sys { width: 10.6rem; height: 6.2rem; aspect-ratio: auto; padding: 1rem 1.1rem; border-radius: 1rem; background: color-mix(in oklab, var(--c2) 55%, var(--ink-raised)); }
.tile.sys .glyph .ic { width: 1.9rem; height: 1.9rem; }
.tile.sys .name { font-size: 1.05rem; font-weight: 600; }

.hints { display: flex; align-items: center; justify-content: space-between; gap: 2rem; margin-top: 1.8rem; font-size: .95rem; color: var(--muted); }
.ver { font-size: .85rem; letter-spacing: .04em; }
.hint-list { display: flex; gap: 1.8rem; }
.hint { display: flex; align-items: center; gap: .55rem; }
.bg { display: inline-grid; place-items: center; min-width: 1.6rem; height: 1.6rem; padding: 0 .1rem; box-sizing: border-box; border-radius: 99px; font-size: .82rem; font-weight: 700; color: var(--ink); }
.bg .ic { width: 1rem; height: 1rem; }
.g-a { background: var(--pad-a); }
.g-b { background: var(--pad-b); }
.g-home { background: var(--text); }
.g-num { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 0 .5rem; border-radius: .4rem; font-variant-numeric: tabular-nums; }

.screen.enter .topbar { animation: rise .7s var(--ease) both; }
.screen.enter .hero { animation: rise .7s var(--ease) .08s both; }
.screen.enter .row:nth-child(1) { animation: rise .7s var(--ease) .16s both; }
.screen.enter .row:nth-child(2) { animation: rise .7s var(--ease) .24s both; }
.screen.enter .hints { animation: rise .7s var(--ease) .32s both; }
@keyframes rise { from { opacity: 0; transform: translateY(1.4rem); } to { opacity: 1; transform: none; } }

/* ---------- side sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: #000; opacity: 0; transition: opacity .3s ease; }
.scrim.on { opacity: .58; }
.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; box-sizing: border-box;
  width: 38rem; max-width: 100%; overflow-y: auto;
  padding: max(3rem, env(safe-area-inset-top, 0px)) max(2.8rem, env(safe-area-inset-right, 0px)) 2.4rem 2.8rem;
  background: var(--ink-raised); border-left: 1px solid var(--line);
  transform: translateX(102%); transition: transform .4s var(--ease);
}
.sheet.on { transform: none; }
.sheet.wide { width: 56rem; }
.sheet-title { margin: .8rem 0 .8rem; font-family: var(--font-display); font-weight: 500; font-size: 2.4rem; line-height: 1.05; }
.sheet-lead { margin: 0 0 2rem; color: var(--text-2); font-size: 1.15rem; max-width: 40rem; }
.opts { display: flex; flex-direction: column; gap: .4rem; }
.opt {
  display: flex; align-items: flex-start; gap: 1.1rem; width: 100%; box-sizing: border-box;
  padding: 1rem 1.2rem; margin: 0; border: 0; border-radius: .9rem; background: transparent;
  text-align: left; cursor: pointer; transition: background .2s ease, box-shadow .2s ease;
}
.opt:focus { outline: none; }
.opt.is-focus { background: #ffffff12; box-shadow: inset 0 0 0 .16rem var(--focus); }
.opt[disabled] { cursor: default; opacity: .45; }
.opt-main { display: flex; flex-direction: column; gap: .2rem; flex: 1; min-width: 0; }
.opt-title { font-size: 1.2rem; font-weight: 600; }
.opt-desc { font-size: 1rem; color: var(--muted); }
.opt-val { align-self: center; font-size: 1rem; color: var(--text-2); white-space: nowrap; }
.opt > .ic { margin-top: .1rem; color: var(--text-2); }
.radio { flex: none; display: grid; place-items: center; width: 1.4rem; height: 1.4rem; margin-top: .15rem; box-sizing: border-box; border: .15rem solid var(--muted); border-radius: 50%; }
.opt[aria-checked="true"] .radio { border-color: var(--text); }
.opt[aria-checked="true"] .radio::after { content: ""; width: .7rem; height: .7rem; border-radius: 50%; background: var(--text); }
.tag { flex: none; align-self: center; padding: .2rem .6rem; font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: var(--text-2); border-radius: .35rem; }
.sep { height: 1px; margin: 1.4rem 0; background: var(--line); }
.status-card { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.6rem; padding: 1.1rem 1.3rem; border: 1px solid var(--line); border-radius: 1rem; background: #ffffff06; }
.sdot { flex: none; width: .8rem; height: .8rem; border-radius: 50%; background: var(--muted); }
.sdot.on { background: var(--pad-a); box-shadow: 0 0 .8rem var(--pad-a); }
.sc-title { font-weight: 600; font-size: 1.1rem; }
.sc-sub { font-size: .98rem; color: var(--muted); }
.fine { margin: 1.4rem 0 0; font-size: .92rem; color: var(--muted); }
kbd { font-family: var(--font-body); font-weight: 700; padding: .05rem .45rem; border: 1px solid var(--line); border-radius: .35rem; color: var(--text-2); }

.remote-grid { display: grid; grid-template-columns: auto 1fr; gap: 2.4rem; align-items: center; margin-bottom: 1.8rem; }
.qr-card { display: flex; flex-direction: column; align-items: center; gap: .8rem; }
.qr-card svg { display: block; width: 13rem; height: 13rem; border-radius: .9rem; }
.qr-addr { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-2); }
.steps { display: flex; flex-direction: column; gap: 1.1rem; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: flex; gap: 1rem; font-size: 1.12rem; color: var(--text-2); counter-increment: s; }
.steps li::before { content: counter(s); flex: none; display: grid; place-items: center; width: 1.9rem; height: 1.9rem; font-weight: 700; font-size: .95rem; color: var(--text); border: 1px solid var(--line); border-radius: 50%; }

/* ---------- app launch ---------- */
.launch {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center;
  background: linear-gradient(150deg, color-mix(in oklab, var(--c1) 58%, var(--ink)) 0%, color-mix(in oklab, var(--c2) 72%, var(--ink)) 100%);
  clip-path: circle(0px at var(--x, 50%) var(--y, 50%));
  transition: clip-path .62s cubic-bezier(.6, 0, .2, 1);
}
.launch.on { clip-path: circle(150vmax at var(--x, 50%) var(--y, 50%)); }
.launch-inner { display: flex; flex-direction: column; align-items: center; gap: 1rem; max-width: 52rem; padding: 0 max(16px, env(safe-area-inset-right, 0px)); }
.launch-glyph .ic { width: 6rem; height: 6rem; }
.launch .eyebrow { color: #ffffffb0; margin-top: 1rem; }
.launch-title { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 4rem; line-height: 1.05; }
.launch-status { margin: 0; font-size: 1.3rem; color: #ffffffd0; }
.launch-bar { position: relative; width: 18rem; height: .25rem; margin-top: .6rem; overflow: hidden; border-radius: 9px; background: #ffffff2a; }
.launch-bar i { position: absolute; top: 0; bottom: 0; width: 40%; background: #fff; border-radius: 9px; animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.launch-note { margin: .6rem 0 0; font-size: 1.25rem; line-height: 1.5; color: #fffffff0; text-wrap: pretty; }
.launch-fine { margin: 0; font-size: 1rem; color: #ffffffa0; }
.launch.ready .launch-bar { display: none; }
.launch:not(.ready) .launch-note, .launch:not(.ready) .launch-fine { display: none; }
.l-back { display: inline-flex; align-items: center; gap: .7rem; margin-top: 1.6rem; padding: .7rem 1.3rem .7rem .8rem; border: 1px solid #ffffff40; border-radius: 99px; background: #00000030; font-weight: 600; cursor: pointer; }
.l-back:focus-visible { outline: .18rem solid #fff; outline-offset: .2rem; }

/* ---------- boot ---------- */
.boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow: hidden; background: var(--ink); transition: opacity .6s ease; }
.boot.out { opacity: 0; pointer-events: none; }
.boot-glow { position: absolute; inset: 0; background: radial-gradient(46% 40% at 50% 50%, #26355f66, transparent 70%); }
.boot-logo { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2.2rem; }
.boot .mark { width: 7rem; height: auto; opacity: 0; }
.word { font-family: var(--font-display); font-weight: 500; font-size: 4.2rem; letter-spacing: .34em; margin-right: -.34em; line-height: 1; }
.word span { display: inline-block; opacity: 0; }
.boot-bar { width: 14rem; height: .18rem; overflow: hidden; border-radius: 9px; background: #ffffff1a; }
.boot-bar i { display: block; height: 100%; background: var(--text); transform-origin: left; transform: scaleX(0); }
.crt-flash { position: absolute; inset: 0; background: #f2f5ff; opacity: 0; }
.boot.run .crt-flash { animation: crtOn .95s cubic-bezier(.2, .7, .2, 1) forwards; }
.boot.run .mark { animation: markIn .9s var(--ease) .62s forwards; }
.boot.run .mark .ln { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .6s ease .9s forwards; }
.boot.run .mark .led { opacity: 0; animation: ledOn .3s steps(2) 1.5s forwards; }
.boot.run .word span { animation: letter .75s var(--ease) forwards; animation-delay: calc(.8s + var(--i) * .065s); }
.boot.run .boot-bar i { animation: fill 1.35s cubic-bezier(.5, 0, .2, 1) 1.05s forwards; }
@keyframes crtOn {
  0%   { transform: scale(0, .004); opacity: 1; }
  32%  { transform: scale(1, .004); opacity: 1; }
  60%  { transform: scale(1, 1); opacity: .95; }
  100% { transform: scale(1, 1); opacity: 0; }
}
@keyframes markIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes ledOn { to { opacity: 1; } }
@keyframes letter {
  0%   { opacity: 0; transform: translateY(.45em); text-shadow: -.16em 0 #ff2d55e0, .16em 0 #2de1ffe0; }
  55%  { opacity: 1; }
  100% { opacity: 1; transform: none; text-shadow: 0 0 #ff2d5500, 0 0 #2de1ff00; }
}
@keyframes fill { to { transform: scaleX(1); } }

/* ---------- off / sleep ---------- */
.off { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; text-align: center; background: #000; color: var(--muted); cursor: pointer; }
.off.fade { animation: fadeIn .8s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.off-led { position: absolute; right: max(3rem, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: max(2.4rem, calc(env(safe-area-inset-bottom, 0px) + 16px)); width: .7rem; height: .7rem; border-radius: 50%; background: var(--led); box-shadow: 0 0 .9rem var(--led); }
.off-msg { margin: 0; font-size: 1.15rem; }
.sleep-clock { margin: 0 0 1rem; font-family: var(--font-display); font-weight: 300; font-size: 9rem; line-height: 1; color: #ffffff38; font-variant-numeric: tabular-nums; }
.off[data-kind="off"] .sleep-clock { display: none; }

.blink { position: fixed; inset: 0; z-index: 40; background: #000; opacity: 0; pointer-events: none; }
.blink.run { animation: blink .7s ease; }
@keyframes blink { 0% { opacity: 0; } 35%, 60% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- toast & volume ---------- */
.toast {
  position: fixed; left: 50%; top: max(6rem, calc(env(safe-area-inset-top, 0px) + 16px)); z-index: 60;
  display: flex; align-items: center; gap: .8rem; box-sizing: border-box; width: max-content; max-width: calc(100% - 32px);
  padding: .85rem 1.5rem .85rem 1.1rem; border: 1px solid var(--line); border-radius: 99px;
  background: var(--ink-raised); box-shadow: 0 1rem 2.4rem -1rem #000; font-size: 1.05rem;
  opacity: 0; transform: translate(-50%, -1rem); transition: opacity .3s ease, transform .3s var(--ease); pointer-events: none;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast-ic .ic { width: 1.3rem; height: 1.3rem; }
.vol {
  position: fixed; top: 50%; right: max(3rem, calc(env(safe-area-inset-right, 0px) + 16px)); z-index: 55;
  display: flex; flex-direction: column; align-items: center; gap: .8rem; padding: 1.2rem .8rem;
  border: 1px solid var(--line); border-radius: 99px; background: var(--ink-raised);
  opacity: 0; transform: translate(1rem, -50%); transition: opacity .25s ease, transform .25s var(--ease); pointer-events: none;
}
.vol.on { opacity: 1; transform: translate(0, -50%); }
.vol-track { position: relative; width: .5rem; height: 12rem; overflow: hidden; border-radius: 9px; background: #ffffff1f; }
.vol-track i { position: absolute; inset: 0; background: var(--text); transform-origin: bottom; transform: scaleY(var(--v, .35)); transition: transform .15s ease; }
.vol-num { font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- phone remote (demo) ---------- */
.phone {
  position: fixed; top: 50%; right: max(2.4rem, calc(env(safe-area-inset-right, 0px) + 16px)); z-index: 58;
  display: flex; flex-direction: column; gap: 1.1rem; width: 17rem; box-sizing: border-box;
  padding: 1.5rem 1.3rem 1.4rem; transform: translateY(-50%);
  background: #0a0d13; border: 1px solid #ffffff26; border-radius: 2.6rem; box-shadow: 0 2rem 4rem -1rem #000000d0;
  font-size: 1rem; animation: phoneIn .45s var(--ease);
}
@keyframes phoneIn { from { opacity: 0; transform: translate(2rem, -50%); } }
.phone-head { display: flex; align-items: center; gap: .55rem; font-size: .9rem; font-weight: 600; color: var(--text-2); }
.live { width: .55rem; height: .55rem; border-radius: 50%; background: var(--pad-a); box-shadow: 0 0 .6rem var(--pad-a); }
.phone-x { margin-left: auto; display: grid; place-items: center; width: 1.9rem; height: 1.9rem; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: none; cursor: pointer; }
.phone-x .ic { width: 1rem; height: 1rem; }
.psearch { display: flex; gap: .5rem; }
.psearch input { flex: 1; min-width: 0; box-sizing: border-box; padding: .6rem .8rem; font: inherit; font-size: .95rem; color: var(--text); background: #ffffff0f; border: 1px solid var(--line); border-radius: .7rem; }
.psearch input:focus { outline: .14rem solid #ffffff80; }

  const PANELS = {
    display: () => ({
      title: 'Écran', lead: 'Choisis où s’affiche Scaros. Le son suit toujours l’image.',
      body: `<div class="status-card"><span class="sdot ${state.hdmi ? 'on' : ''}"></span><div><div class="sc-title">Télé (HDMI) : ${state.hdmi ? 'branchée' : 'non branchée'}</div><div class="sc-sub">Affichage actuel : ${output() === 'tv' ? 'la télé' : 'l’écran du PC'}</div></div></div>
        <div class="opts" role="radiogroup" aria-label="Où afficher Scaros">
          ${radio('mode:auto', 'Auto', 'Passe sur la télé dès que le HDMI est branché, revient sur le PC quand tu le débranches.', state.mode === 'auto')}
          ${radio('mode:pc', 'Écran du PC', 'Reste sur l’écran du portable, même si la télé est branchée.', state.mode === 'pc')}
          ${radio('mode:tv', 'Télé (HDMI)', state.hdmi ? 'Tout passe sur la télé, l’écran du PC s’éteint.' : 'Branche le câble HDMI pour la choisir.', state.mode === 'tv', !state.hdmi)}
        </div>
        <div class="sep"></div>
        <div class="opts"><button type="button" class="opt" data-act="hdmi"><span class="tag">Démo</span><span class="opt-main"><span class="opt-title">${state.hdmi ? 'Débrancher' : 'Brancher'} le câble HDMI</span><span class="opt-desc">Simule la télé pour voir la bascule. Raccourci clavier : <kbd>H</kbd></span></span></button></div>`
    }),
    remote: () => {
      const qr = qrSVG(REMOTE_URL);
      return {
        wide: true, title: 'Télécommande', lead: 'Ton téléphone devient une télécommande, avec un clavier pour taper tes recherches.',
        body: `<div class="remote-grid">
            ${qr ? `<div class="qr-card">${qr}<p class="qr-addr">scaros.local:8080</p></div>` : `<div class="qr-card"><p class="qr-addr">scaros.local:8080</p></div>`}
            <ol class="steps"><li>Connecte ton téléphone au même Wi-Fi que Scaros.</li><li>Scanne le QR code avec l’appareil photo.</li><li>La télécommande s’ouvre dans le navigateur. Rien à installer.</li></ol>
          </div>
          <div class="opts">
            ${row('phone', 'phone', state.phone ? 'Masquer la télécommande de démo' : 'Essayer la télécommande ici', 'Affiche à côté du menu la page que verra ton téléphone.')}
            ${row('close', 'back', 'Fermer', '')}
          </div>
          <p class="fine">Maquette : le QR code pointe vers une adresse d’exemple. Dans la version installée, il pointe vers ton PC.</p>`
      };
    },
    settings: () => ({
      title: 'Paramètres', lead: 'Les réglages de base, tous faisables à la manette.',
      body: `<div class="opts">
          ${row('info', 'wifi', 'Wi-Fi', 'Choisir un réseau et entrer le mot de passe')}
          ${row('info', 'gamepad', 'Manette', 'Appairage Bluetooth', state.pad ? 'Connectée' : 'Non détectée')}
          ${row('info', 'speaker', 'Son', 'Volume et sortie audio', 'Suit l’écran')}
          ${row('replay', 'replay', 'Animation de démarrage', 'Le logo Scaros à l’allumage', 'Rejouer')}
          ${row('info', 'info', 'À propos', 'Version et infos sur le PC', 'Scaros OS 0.1')}
        </div>`
    }),
    power: () => ({
      title: 'Éteindre', lead: 'Que veux-tu faire ?',
      body: `<div class="opts">
          ${row('power:sleep', 'moon', 'Mettre en veille', 'L’écran s’éteint, une touche le rallume.')}
          ${row('power:restart', 'replay', 'Redémarrer', 'Scaros redémarre et revient sur ce menu.')}
          ${row('power:off', 'power', 'Éteindre', 'Le PC s’éteint complètement.')}
          ${row('close', 'back', 'Annuler', '')}
        </div>`
    })
  };

  function renderPanel(keepAct) {
    const p = PANELS[state.panel]();
    sheet.classList.toggle('wide', !!p.wide);
    sheet.innerHTML = `<p class="eyebrow">Système</p><h2 class="sheet-title">${p.title}</h2><p class="sheet-lead">${p.lead}</p>${p.body}`;
    state.pItems = [...sheet.querySelectorAll('[data-act]:not([disabled])')];
    const i = keepAct ? state.pItems.findIndex(el => el.dataset.act === keepAct) : 0;
    setPIdx(Math.max(0, i));
  }
  function setPIdx(i) {
    state.pIdx = i;
    state.pItems.forEach((el, k) => el.classList.toggle('is-focus', k === i));
    const el = state.pItems[i];
    if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'nearest' }); }
  }
  function openPanel(id) {
    state.panel = id;
    sheet.hidden = false; scrim.hidden = false;
    renderPanel();
    void sheet.offsetWidth;
    sheet.classList.add('on'); scrim.classList.add('on');
    updateHints();
  }
  function closePanel() {
    if (!state.panel) return;
    state.panel = null;
    sheet.classList.remove('on'); scrim.classList.remove('on');
    setTimeout(() => { if (!state.panel) { sheet.hidden = true; scrim.hidden = true; } }, 420);
    setFocus(state.focus);
    updateHints();
  }
  function activate(act) {
    const [k, v] = act.split(':');
    if (k === 'mode') { state.mode = v; applyOutput(); renderPanel(act); }
    else if (k === 'hdmi') { setHdmi(!state.hdmi); renderPanel('hdmi'); }
    else if (k === 'close') closePanel();
    else if (k === 'phone') { closePanel(); showPhone(!state.phone); }
    else if (k === 'replay') { closePanel(); boot(); }
    else if (k === 'info') toast('sliders', 'Ce réglage arrive avec la version installée.');
    else if (k === 'power') { closePanel(); v === 'sleep' ? sleep() : powerOff(v === 'restart'); }
  }

  // ---------- display output ----------
  function applyOutput(silent) {
    const o = output();
    if (o !== lastOut) {
      lastOut = o;
      if (!silent) {
        const bl = $('#blink'); bl.classList.remove('run'); void bl.offsetWidth; bl.classList.add('run');
        toast(o === 'tv' ? 'tv' : 'laptop', o === 'tv' ? 'Image et son passent sur la télé.' : 'Retour sur l’écran du PC.');
      }
    }
    renderStatus();
    if (state.focus === 'display' && !state.panel) renderHero();
  }
  function setHdmi(on) {
    state.hdmi = on;
    if (!on && state.mode === 'tv') state.mode = 'auto';
    const before = lastOut;
    applyOutput();
    if (lastOut === before) toast('tv', on ? 'Télé branchée. Scaros reste sur l’écran du PC, comme tu l’as choisi.' : 'Télé débranchée.');
  }

  // ---------- launching an app ----------
  let launchTimer;
  function launch(id) {
    const t = byId[id];
    if (!t.ch) { openPanel(id); return; }
    const r = $('#t-' + id).getBoundingClientRect();
    L.style.setProperty('--x', `${r.left + r.width / 2}px`);
    L.style.setProperty('--y', `${r.top + r.height / 2}px`);
    L.style.setProperty('--c1', t.c1); L.style.setProperty('--c2', t.c2);
    $('#l-glyph').innerHTML = icon(t.glyph);
    $('#l-eyebrow').innerHTML = `Chaîne <span class="num">${pad2(t.ch)}</span>`;
    $('#l-title').textContent = t.name;
    $('#l-status').textContent = `Ouverture de ${t.name}…`;
    L.classList.remove('ready');
    state.launched = id;
    L.hidden = false; void L.offsetWidth; L.classList.add('on');
    clearTimeout(launchTimer);
    launchTimer = setTimeout(() => {
      if (id === 'spotify') {
        $('#l-status').textContent = 'Prêt pour Spotify Connect';
        $('#l-note').textContent = 'Sur ton téléphone, ouvre Spotify, touche l’icône des appareils et choisis « Scaros ». La pochette s’affichera ici en grand.';
      } else {
        $('#l-status').textContent = `${t.name} est ouvert`;
        $('#l-note').textContent = `Dans la version installée, ${t.name} s’affiche ici en plein écran, en interface TV.`;
      }
      $('#l-fine').textContent = 'Maquette : aucune appli n’est vraiment lancée.';
      L.classList.add('ready');
      $('#l-back').focus({ preventScroll: true });
    }, reduce ? 0 : 1400);
  }
  function closeLaunch() {
    clearTimeout(launchTimer);
    state.launched = null;
    L.classList.remove('on');
    setTimeout(() => { if (!state.launched) L.hidden = true; }, 650);
    setFocus(state.focus);
  }
  function channel(a) {
    const t = APPS.find(x => 'ch' + x.ch === a);
    if (!t) return;
    setFocus(t.id, !state.launched);
    launch(t.id);
  }

  // ---------- boot, power, sleep ----------
  let bootTimer, firstBoot = true;
  function boot() {
    state.booting = true;
    B.hidden = false; B.classList.remove('run', 'out'); void B.offsetWidth; B.classList.add('run');
    clearTimeout(bootTimer);
    bootTimer = setTimeout(endBoot, reduce ? 0 : 2750);
  }
  function endBoot() {
    if (!state.booting) return;
    state.booting = false; clearTimeout(bootTimer);
    B.classList.add('out');
    screen.classList.remove('enter'); void screen.offsetWidth; screen.classList.add('enter');
    setTimeout(() => { if (!state.booting) B.hidden = true; }, 650);
    setFocus(state.focus);
    if (firstBoot) {
      firstBoot = false;
      const touch = matchMedia('(pointer: coarse)').matches;
      setTimeout(() => {
        if (state.pad) return;
        toast(touch ? 'phone' : 'gamepad', touch
          ? 'Touche une tuile pour l’ouvrir. Sur le PC, tout se fait à la manette.'
          : 'Flèches et Entrée pour naviguer, Échap pour revenir. La manette Xbox marche aussi.', 5600);
      }, 900);
    }
  }
  function showOff(kind) {
    OFF.dataset.kind = kind;
    $('#off-msg').textContent = kind === 'off' ? 'Scaros est éteint. Appuie sur une touche pour rallumer.' : 'Veille. Appuie sur une touche pour revenir.';
    OFF.classList.toggle('fade', kind === 'sleep');
    OFF.hidden = false;
  }
  function powerOff(restart) {
    state.power = 'busy';
    crt.classList.add('crt-off');
    setTimeout(() => {
      if (restart) { state.power = null; boot(); }
      else { state.power = 'off'; showOff('off'); }
      crt.classList.remove('crt-off');
    }, reduce ? 30 : 820);
  }
  function sleep() { state.power = 'sleep'; showOff('sleep'); }
  function wake() {
    const was = state.power;
    state.power = null; OFF.hidden = true;
    if (was === 'off') boot(); else setFocus(state.focus);
  }

  // ---------- toast & volume ----------
  let toastTimer, volTimer;
  function toast(ic, text, ms = 3400) {
    T.querySelector('.toast-ic').innerHTML = icon(ic);
    T.querySelector('.toast-text').textContent = text;
    T.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => T.classList.remove('on'), ms);
  }
  function vol(d) {
    state.volume = Math.max(0, Math.min(100, state.volume + d));
    V.style.setProperty('--v', state.volume / 100);
    $('#vol-num').textContent = state.volume;
    V.classList.add('on');
    clearTimeout(volTimer);
    volTimer = setTimeout(() => V.classList.remove('on'), 1500);
  }

  // ---------- phone remote demo ----------
  function showPhone(on) {
    state.phone = on; P.hidden = !on; renderStatus();
    if (on) toast('phone', 'Téléphone connecté. Essaie les flèches de la télécommande.');
  }
  P.addEventListener('click', e => {
    const b = e.target.closest('[data-pact]');
    if (!b) return;
    const a = b.dataset.pact;
    if (a === 'close') { showPhone(false); return; }
    b.classList.remove('press'); void b.offsetWidth; b.classList.add('press');
    act(a);
  });
  $('#psearch').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#pinput').value.trim();
    if (!v) return;
    toast('send', `Envoyé à l’écran : « ${v} »`);
    $('#pinput').value = '';
  });

  // ---------- one entry point for every input ----------
  function act(a) {
    if (state.booting) { endBoot(); return; }
    if (state.power === 'busy') return;
    if (state.power) { wake(); return; }
    if (a === 'volup') return vol(5);
    if (a === 'voldown') return vol(-5);
    if (state.launched) {
      if (a === 'back' || a === 'home') closeLaunch();
      else if (a.startsWith('ch')) channel(a);
      return;
    }
    if (state.panel) {
      if (a === 'up') setPIdx(Math.max(0, state.pIdx - 1));
      else if (a === 'down') setPIdx(Math.min(state.pItems.length - 1, state.pIdx + 1));
      else if (a === 'ok') { const el = state.pItems[state.pIdx]; if (el) activate(el.dataset.act); }
      else if (a === 'back' || a === 'home') closePanel();
      else if (a.startsWith('ch')) { closePanel(); channel(a); }
      return;
    }
    if (a === 'up' || a === 'down' || a === 'left' || a === 'right') move(a);
    else if (a === 'ok') launch(state.focus);
    else if (a === 'home') setFocus('youtube');
    else if (a.startsWith('ch')) channel(a);
  }

  // keyboard
  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok',
    Escape: 'back', Backspace: 'back', Home: 'home', '+': 'volup', '=': 'volup', '-': 'voldown',
    '1': 'ch1', '2': 'ch2', '3': 'ch3', '4': 'ch4' };
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ((e.key === 'h' || e.key === 'H') && !state.booting && !state.power) {
      setHdmi(!state.hdmi);
      if (state.panel === 'display') renderPanel(state.pItems[state.pIdx]?.dataset.act);
      return;
    }
    const a = KEYS[e.key];
    if (!a) { if (state.booting) endBoot(); else if (state.power && state.power !== 'busy') wake(); return; }
    // Enter on a plain button (phone, "retour") keeps its native click
    if (a === 'ok' && e.target.closest && e.target.closest('.pbtn, .l-back, .phone-x, .dpad button')) return;
    e.preventDefault();
    act(a);
  });

  // pointer
  tiles.forEach(el => {
    el.addEventListener('click', () => {
      if (state.booting || state.power) return act('ok');
      setFocus(el.dataset.id); launch(el.dataset.id);
    });
    el.addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse' && state.focus !== el.dataset.id && !state.panel && !state.launched) setFocus(el.dataset.id);
    });
    el.addEventListener('focus', () => { if (state.focus !== el.dataset.id) setFocus(el.dataset.id, false); });
  });
  sheet.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const i = state.pItems.indexOf(el);
    if (i >= 0) setPIdx(i);
    activate(el.dataset.act);
  });
  sheet.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const el = e.target.closest('[data-act]');
    const i = el ? state.pItems.indexOf(el) : -1;
    if (i >= 0 && i !== state.pIdx) setPIdx(i);
  });
  sheet.addEventListener('focusin', e => {
    const i = state.pItems.indexOf(e.target);
    if (i >= 0 && i !== state.pIdx) setPIdx(i);
  });
  scrim.addEventListener('click', closePanel);
  $('#l-back').addEventListener('click', closeLaunch);
  B.addEventListener('click', endBoot);
  OFF.addEventListener('click', () => { if (state.power && state.power !== 'busy') wake(); });

  // controller (Xbox over Bluetooth shows up as a standard gamepad)
  const held = {};
  let polling = false;
  function pads() { try { return navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; } catch (e) { return []; } }
  function repeat(k, on, now) {
    const h = held[k] || (held[k] = { on: false, next: 0 });
    if (on && !h.on) { act(k); h.next = now + 380; }
    else if (on && now >= h.next) { act(k); h.next = now + 120; }
    h.on = on;
  }
  function edge(k, on, a) {
    const h = held[k] || (held[k] = { on: false });
    if (on && !h.on) act(a);
    h.on = on;
  }
  function padLoop() {
    const gp = pads()[0];
    if (gp) {
      const now = performance.now(), b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
      const x = gp.axes[0] || 0, y = gp.axes[1] || 0;
      repeat('up', b(12) || y < -.55, now);
      repeat('down', b(13) || y > .55, now);
      repeat('left', b(14) || x < -.55, now);
      repeat('right', b(15) || x > .55, now);
      edge('a', b(0), 'ok'); edge('b', b(1), 'back'); edge('guide', b(16), 'home');
      edge('lb', b(4), 'voldown'); edge('rb', b(5), 'volup');
    }
    if (polling) requestAnimationFrame(padLoop);
  }
  addEventListener('gamepadconnected', e => {
    state.pad = e.gamepad.id; renderStatus();
    toast('gamepad', /xbox|xinput|045e/i.test(e.gamepad.id) ? 'Manette Xbox connectée.' : 'Manette connectée.');
    if (!polling) { polling = true; padLoop(); }
  });
  addEventListener('gamepaddisconnected', () => {
    const left = pads();
    state.pad = left.length ? left[0].id : null;
    if (!left.length) polling = false;
    renderStatus(); toast('gamepad', 'Manette déconnectée.');
  });

  // clock
  const fT = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const fD = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  function tick() {
    const d = new Date();
    $('#clock').textContent = fT.format(d);
    $('#sleep-clock').textContent = fT.format(d);
    $('#date').textContent = fD.format(d);
  }
  tick(); setInterval(tick, 10000);

  // start
  applyOutput(true);
  updateHints();
  setFocus('youtube', false);
  boot();
})();
</script>
