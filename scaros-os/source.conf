# D'où Scaros télécharge ses mises à jour : un dépôt GitHub public.
#   REPO   : propriétaire/nom du dépôt, par exemple ton-pseudo/scaros-os
#   BRANCH : branche à suivre (laisse vide pour la branche principale du dépôt)
#
# Ce fichier est copié dans /etc/scaros/source.conf à l'installation.
# Sur un PC déjà installé, pour changer de dépôt : su -   puis   scaros-update --depuis ton-pseudo/scaros-os
REPO=belugas62/Neo
BRANCH=scaros-os
